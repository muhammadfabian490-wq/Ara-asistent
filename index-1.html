<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#1a1a1a"/>
<title>Ara — Asisten Pribadimu</title>
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Ara&quot;,&quot;short_name&quot;:&quot;Ara&quot;,&quot;start_url&quot;:&quot;/&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;theme_color&quot;:&quot;%231a1a1a&quot;,&quot;background_color&quot;:&quot;%23f2f2f0&quot;}"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'DM Sans',sans-serif;background:var(--bg,#f2f2f0);}
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
@keyframes blink{0%,80%,100%{transform:scale(.85);opacity:.3;}40%{transform:scale(1.2);opacity:1;}}
@keyframes slideUp{from{transform:translateY(50px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
@keyframes blink-c{0%,100%{opacity:1;}50%{opacity:0;}}
@keyframes spin{to{transform:rotate(360deg);}}
:root{
  --bg:#f2f2f0;--win:#fff;--hd:#fff;
  --bbot:#f4f4f2;--bbot-tx:#1a1a1a;
  --busr:#1a1a1a;--busr-tx:#fff;
  --tx:#1a1a1a;--sub:#aaa;--border:#f0f0f0;
  --ibg:#fafafa;--iborder:#e8e8e8;--time:#c8c8c8;
  --qbg:#f8f8f6;--qtx:#888;--accent:#1a1a1a;
  --ov:rgba(0,0,0,.4);--sbg:#fff;
}
.dark{
  --bg:#111;--win:#1c1c1c;--hd:#1c1c1c;
  --bbot:#2a2a2a;--bbot-tx:#e0e0e0;
  --busr:#fff;--busr-tx:#1a1a1a;
  --tx:#e8e8e8;--sub:#666;--border:#2a2a2a;
  --ibg:#252525;--iborder:#383838;--time:#555;
  --qbg:#252525;--qtx:#888;--sbg:#2a2a2a;
  --ov:rgba(0,0,0,.7);
}
#app{height:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);transition:background .2s;}
.win{width:100%;max-width:480px;height:min(88vh,780px);background:var(--win);border-radius:22px;box-shadow:0 12px 50px rgba(0,0,0,.13);display:flex;flex-direction:column;overflow:hidden;transition:background .2s;position:relative;}
/* Header */
.hd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--hd);}
.hdav{width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;transition:background .2s;}
.hdav span{color:#fff;font-weight:700;font-size:17px;}
.dot-on{position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid var(--win);}
.hd-info{margin-left:12px;flex:1;}
.hd-name{font-weight:700;font-size:15px;color:var(--tx);display:flex;align-items:center;gap:5px;}
.hd-sub{font-size:12px;color:var(--sub);margin-top:1px;}
.hd-btns{display:flex;gap:2px;}
.icon-btn{background:none;border:none;cursor:pointer;padding:8px;border-radius:10px;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.icon-btn:hover{background:var(--border);}
.icon-btn svg path,.icon-btn svg circle{stroke:var(--sub);}
/* Banners */
.banner-incog{background:#1e293b;color:#94a3b8;padding:8px 16px;font-size:12px;text-align:center;}
.banner-err{background:#fff7ed;color:#c2410c;padding:9px 16px;font-size:13px;border-bottom:1px solid #fed7aa;}
.banner-dl{background:#f0fdf4;color:#166534;padding:9px 16px;font-size:13px;border-bottom:1px solid #bbf7d0;display:flex;align-items:center;gap:8px;}
.badge-incog{font-size:11px;background:rgba(148,163,184,.15);color:#94a3b8;padding:2px 7px;border-radius:99px;}
/* Messages */
.msgs{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px;}
.row-bot{display:flex;align-items:flex-start;gap:8px;}
.row-usr{display:flex;justify-content:flex-end;}
.msg-in{animation:fadeIn .2s ease;}
.av{width:30px;height:30px;border-radius:50%;background:var(--bbot);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.av svg path,.av svg circle{stroke:var(--accent);}
.bb{background:var(--bbot);color:var(--bbot-tx);border-radius:4px 16px 16px 16px;padding:10px 12px 6px 14px;font-size:14px;line-height:1.65;max-width:290px;}
.bu{background:var(--busr);color:var(--busr-tx);border-radius:16px 4px 16px 16px;padding:10px 14px;font-size:14px;line-height:1.65;max-width:290px;word-break:break-word;}
.ts{font-size:11px;color:var(--time);margin-top:4px;padding-left:2px;}
.ts-r{text-align:right;}
.bb-actions{display:flex;align-items:center;gap:4px;margin-top:4px;}
.cp-btn,.regen-btn{background:none;border:none;cursor:pointer;padding:3px 5px;border-radius:5px;display:inline-flex;align-items:center;gap:3px;transition:background .15s;font-family:'DM Sans',sans-serif;font-size:11px;color:var(--sub);}
.cp-btn:hover,.regen-btn:hover{background:var(--border);}
.cp-btn svg path,.regen-btn svg path{stroke:var(--sub);}
/* Typing */
.tdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sub);animation:blink 1.2s infinite ease-in-out;}
.cursor{display:inline-block;width:2px;height:14px;background:var(--accent);border-radius:1px;margin-left:2px;vertical-align:middle;animation:blink-c .7s infinite;}
/* Scroll btn */
.scroll-btn{position:absolute;bottom:130px;right:16px;width:36px;height:36px;border-radius:50%;background:var(--sbg);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;animation:fadeIn .2s ease;}
.scroll-btn svg path{stroke:var(--tx);}
/* Code */
.ic{background:#f0f0ee;color:#c0392b;padding:1px 5px;border-radius:4px;font-size:12.5px;font-family:monospace;}
.dark .ic{background:#333;color:#f08080;}
.cblk{background:#1a1a1a;border-radius:10px;margin:8px 0;overflow:hidden;}
.cblk-hd{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #2a2a2a;}
.clang{color:#666;font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-family:monospace;}
.ccopy{background:none;border:none;cursor:pointer;color:#888;font-size:11px;font-family:'DM Sans',sans-serif;}
.ccopy:hover{color:#bbb;}
.cpre{padding:12px 14px;font-size:12px;font-family:monospace;overflow-x:auto;line-height:1.6;color:#e8e8e8;margin:0;}
/* Quick prompts */
.quick{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;border-top:1px solid var(--border);scrollbar-width:none;}
.quick::-webkit-scrollbar{display:none;}
.qchip{flex-shrink:0;background:var(--qbg);color:var(--qtx);border:1px solid var(--border);border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:all .15s;}
.qchip:hover{background:var(--border);color:var(--tx);}
/* Input */
.inrow{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;background:var(--hd);}
.ta-in{flex:1;resize:none;border:1.5px solid var(--iborder);border-radius:14px;padding:10px 14px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;color:var(--tx);background:var(--ibg);line-height:1.5;transition:border-color .2s,background .2s;max-height:120px;overflow-y:auto;}
.ta-in:focus{border-color:var(--accent)!important;background:var(--win)!important;}
.ta-in::placeholder{color:var(--sub);}
.mic-btn{width:40px;height:40px;border-radius:13px;flex-shrink:0;border:1.5px solid var(--iborder);background:var(--ibg);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);transition:all .2s;}
.mic-btn.on{border-color:#ef4444;background:#fff1f1;color:#ef4444;animation:pulse 1s infinite;}
.mic-btn svg path,.mic-btn svg rect{stroke:currentColor;}
.send-btn{width:42px;height:42px;border-radius:13px;flex-shrink:0;background:var(--accent);border:none;display:flex;align-items:center;justify-content:center;transition:opacity .2s;cursor:pointer;}
.send-btn:disabled{opacity:.25;cursor:default;}
.stop-btn{width:42px;height:42px;border-radius:13px;flex-shrink:0;background:#ef4444;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
/* Settings overlay */
.overlay{position:fixed;inset:0;z-index:100;background:var(--ov);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);}
.sett{width:100%;max-width:480px;background:var(--win);border-radius:22px 22px 0 0;max-height:88vh;display:flex;flex-direction:column;animation:slideUp .25s cubic-bezier(.34,1.2,.64,1);}
.sett-hd{padding:20px 20px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.sett-body{flex:1;overflow-y:auto;padding:16px 20px;}
.sett-ft{padding:14px 20px;border-top:1px solid var(--border);}
.sec{margin-bottom:22px;}
.sec-lbl{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;}
.inp{width:100%;border:1.5px solid var(--iborder);border-radius:12px;padding:10px 14px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;color:var(--tx);background:var(--ibg);transition:border-color .15s;}
.inp:focus{border-color:var(--accent)!important;}
.inp::placeholder,.ta::placeholder{color:var(--sub);}
.ta{width:100%;resize:none;border:1.5px solid var(--iborder);border-radius:12px;padding:10px 14px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;color:var(--tx);background:var(--ibg);line-height:1.6;}
.ta:focus{border-color:var(--accent)!important;}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pcard{border:1.5px solid var(--iborder);border-radius:12px;padding:12px 10px;background:var(--ibg);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;}
.pcard.on{border-color:var(--accent);background:rgba(0,0,0,.04);}
.dark .pcard.on{background:rgba(255,255,255,.06);}
.lrow{display:flex;gap:8px;}
.lchip{flex:1;padding:8px;border:1.5px solid var(--iborder);border-radius:10px;background:var(--ibg);color:var(--sub);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.lchip.on{border-color:var(--accent);color:var(--tx);font-weight:600;}
.accent-row{display:flex;gap:10px;flex-wrap:wrap;}
.acc-dot{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s;}
.acc-dot.on{border-color:var(--tx)!important;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;}
.toggle{width:44px;height:24px;border-radius:99px;border:none;background:var(--iborder);cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.toggle.on{background:var(--accent);}
.tknob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;}
.toggle.on .tknob{transform:translateX(20px);}
.streak-box{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:20px;}
.dark .streak-box{background:#2a1f00;border-color:#44300a;color:#fbbf24;}
.btn-row{display:flex;gap:8px;}
.outline-btn{flex:1;padding:10px;border:1.5px solid var(--iborder);border-radius:12px;background:none;color:var(--tx);font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.danger-btn{flex:1;padding:10px;border:1.5px solid #fee2e2;border-radius:12px;background:#fff5f5;color:#dc2626;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.dark .danger-btn{background:rgba(220,38,38,.1);}
.primary{background:var(--accent);color:#fff;border:none;border-radius:13px;padding:13px 40px;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;width:100%;transition:opacity .2s;}
/* Setup */
.setup-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;gap:18px;}
/* Loading */
.load-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:20px;text-align:center;}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
.prog-track{width:100%;height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
.prog-bar{height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease;}
/* Scrollbar */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
</style>
</head>
<body>
<div id="app"><div class="win" id="win"></div></div>

<script>
// ══════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════
const SK = {
  profile:'ara:profile', settings:'ara:settings', messages:'ara:messages',
  history:'ara:history', memory:'ara:memory', dark:'ara:dark', streak:'ara:streak',
};
const PERSONALITIES = {
  friendly:{ label:'Friendly', icon:'😊', desc:'Hangat & supportif',   prompt:'Kamu ramah, hangat, supportif. Sesekali pakai emoji. Buat pengguna nyaman.' },
  santai:  { label:'Santai',   icon:'😎', desc:'Gaul kayak temen',      prompt:'Kamu santai dan gaul. Pakai bahasa sehari-hari, boleh slang Indo. Kayak temen deket.' },
  pro:     { label:'Pro',      icon:'💼', desc:'Formal & terstruktur',  prompt:'Kamu profesional dan terstruktur. Bahasa Indonesia yang baik dan benar.' },
  sassy:   { label:'Sassy',    icon:'😏', desc:'Witty & cerdas',        prompt:'Kamu witty, cerdas, sedikit sarkastik tapi tetap sangat helpful. Humor tajam.' },
};
const ACCENTS = [
  {id:'black',hex:'#1a1a1a'},{id:'blue',hex:'#2563eb'},{id:'green',hex:'#16a34a'},
  {id:'purple',hex:'#7c3aed'},{id:'rose',hex:'#e11d48'},{id:'orange',hex:'#ea580c'},
];
const LENGTHS = {
  short: { label:'Singkat ⚡', tokens:256,  extra:'Jawab SANGAT singkat, max 2-3 kalimat.' },
  normal:{ label:'Normal 💬',  tokens:512,  extra:'' },
  detail:{ label:'Detail 📖', tokens:1024, extra:'Jawab lengkap dan detail dengan contoh.' },
};
const QUICK_PROMPTS = [
  {icon:'💻',text:'Bantu aku coding:'},{icon:'🌐',text:'Translate ke Inggris:'},
  {icon:'📝',text:'Buatin ringkasan:'},{icon:'🎓',text:'Jelasin simpel:'},
  {icon:'💡',text:'Kasih ide tentang'},{icon:'🎲',text:'Fakta menarik tentang'},
  {icon:'📅',text:'Buatin jadwal untuk'},{icon:'🔍',text:'Bedain perbedaan antara'},
];

// ══════════════════════════════════════════
// STORAGE (localStorage)
// ══════════════════════════════════════════
function sGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch{ return null; } }
function sSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let STATE = {
  phase:'loading', // loading|setup|loadModel|chatting
  isDark: false,
  profile:{ name:'' },
  cfg:{ personality:'friendly', accent:'black', length:'normal', incognito:false },
  memory:'',
  messages:[],
  apiHistory:[],
  streaming: false,
  streamText:'',
  generating: false,
  listening: false,
  error:'',
  showScroll: false,
  showSettings: false,
  streak: null,
  modelLoaded: false,
  modelProgress: 0,
  modelStatus: 'Mempersiapkan...',
  fileProgress: {},
  pipe: null,
  abortCtrl: null,
};
let msgCount = 0;

function now(){ return new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }
function accentHex(){ return ACCENTS.find(a=>a.id===STATE.cfg.accent)?.hex||'#1a1a1a'; }

// ══════════════════════════════════════════
// 🧠 OTAK — Transformers.js (100% Offline)
// ══════════════════════════════════════════
async function loadModel(){
  STATE.phase='loadModel'; render();
  try {
    const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1/dist/transformers.min.js');
    env.allowLocalModels = false;
    STATE.modelStatus = 'Mengunduh model Qwen2.5 0.5B...'; render();

    const pipe = await pipeline('text-generation','onnx-community/Qwen2.5-0.5B-Instruct',{
      dtype:'q4',
      progress_callback(info){
        if(!info) return;
        if(info.status==='progress'){
          const pct = info.progress ?? (info.loaded&&info.total?(info.loaded/info.total*100):0);
          STATE.fileProgress[info.file||'model'] = pct;
          STATE.modelStatus = `Mengunduh: ${shortName(info.file)}`;
        } else if(info.status==='done'){
          if(info.file) STATE.fileProgress[info.file] = 100;
        } else if(info.status==='ready'){
          STATE.modelStatus = 'Model siap!';
        }
        const vals = Object.values(STATE.fileProgress);
        STATE.modelProgress = vals.length ? Math.min(99,Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)) : 0;
        render();
      },
    });

    STATE.pipe = pipe;
    STATE.modelLoaded = true;
    STATE.modelProgress = 100;
    STATE.phase = 'chatting';
    if(!STATE.messages.length){
      addBotMsg(`Halo ${STATE.profile.name}! Aku Ara, asisten pribadimu 😊 Aku sekarang jalan 100% offline di browsermu. Ada yang mau dibahas?`);
    }
  } catch(e){
    STATE.error = 'Gagal memuat model: '+e.message;
    STATE.phase = 'chatting'; // fallback ke chat tanpa model
  }
  render();
}

function shortName(f){ if(!f) return 'file'; const p=f.split('/'); return p[p.length-1]; }

async function askOffline(text){
  if(!STATE.pipe){ STATE.error='Model belum dimuat.'; render(); return; }
  const sys = buildPrompt();
  const chatInput = [
    {role:'system', content:sys},
    ...STATE.apiHistory.slice(-16),
    {role:'user', content:text},
  ];
  try {
    const result = await STATE.pipe(chatInput,{
      max_new_tokens: LENGTHS[STATE.cfg.length]?.tokens||512,
      do_sample:true, temperature:0.7, top_p:0.9, repetition_penalty:1.1,
    });
    const out = result?.[0]?.generated_text;
    let reply = '...';
    if(Array.isArray(out)){
      const last=[...out].reverse().find(m=>m.role==='assistant');
      reply = last?.content?.trim()||'...';
    } else if(typeof out==='string'){ reply=out.trim(); }
    return reply;
  } catch(e){ throw e; }
}

function buildPrompt(){
  const p = PERSONALITIES[STATE.cfg.personality]||PERSONALITIES.friendly;
  const l = LENGTHS[STATE.cfg.length]||LENGTHS.normal;
  return `Kamu adalah Ara, asisten pribadi dari ${STATE.profile.name}.
KEPRIBADIAN: ${p.prompt}
${l.extra?'PANJANG JAWABAN: '+l.extra:''}
INFO TENTANG ${STATE.profile.name.toUpperCase()}: ${STATE.memory?.trim()||'Belum ada catatan.'}
ATURAN: Panggil "${STATE.profile.name}" sesekali. Jawab Bahasa Indonesia kecuali diminta lain. Gunakan markdown jika membantu.`;
}

// ══════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════
function addBotMsg(text){
  const msg = {id:Date.now(),from:'bot',text,time:now()};
  STATE.messages.push(msg);
  if(!STATE.cfg.incognito) sSet(SK.messages,STATE.messages.slice(-100));
}

async function sendMessage(text){
  if(!text||STATE.generating) return;
  STATE.error='';
  const userMsg={id:Date.now(),from:'user',text,time:now()};
  STATE.messages.push(userMsg);
  STATE.apiHistory.push({role:'user',content:text});
  STATE.generating=true; STATE.streamText='';
  render(); scrollBottom();

  try {
    const reply = await askOffline(text);
    STATE.apiHistory.push({role:'assistant',content:reply});
    addBotMsg(reply);
    msgCount++;
    if(msgCount%5===0) autoMemory(text,reply);
  } catch(e){
    if(e.name!=='AbortError'){
      STATE.error='Gagal generate. Coba lagi.';
      STATE.apiHistory.pop();
    }
  }
  STATE.generating=false; render(); scrollBottom();
}

function stopGenerate(){ STATE.generating=false; STATE.streamText=''; render(); }

function regenerate(){
  if(STATE.generating||STATE.messages.length<2) return;
  const lastBotIdx=[...STATE.messages].map(m=>m.from).lastIndexOf('bot');
  if(lastBotIdx===-1) return;
  STATE.messages.splice(lastBotIdx,1);
  const lastAIdx=[...STATE.apiHistory].map(m=>m.role).lastIndexOf('assistant');
  if(lastAIdx!==-1) STATE.apiHistory.splice(lastAIdx,1);
  const lastUser=STATE.apiHistory[STATE.apiHistory.length-1];
  if(!lastUser) return;
  STATE.apiHistory.pop();
  sendMessage(lastUser.content);
}

async function autoMemory(userMsg,reply){
  // Simple keyword extraction tanpa API call
  const combined = userMsg+' '+reply;
  const patterns=[
    {re:/aku (?:suka|hobi|senang) ([\w\s]+)/i,prefix:'Hobi/suka: '},
    {re:/aku (?:kelas|semester|tahun) ([\w\s]+)/i,prefix:'Pendidikan: '},
    {re:/aku (?:tinggal|di) ([\w]+)/i,prefix:'Lokasi: '},
    {re:/aku (?:kerja|bekerja) (?:di|sebagai) ([\w\s]+)/i,prefix:'Pekerjaan: '},
  ];
  let found=[];
  patterns.forEach(({re,prefix})=>{ const m=combined.match(re); if(m) found.push(prefix+m[1]); });
  if(found.length){
    const add=found.join(', ');
    if(!STATE.memory.includes(add)){
      STATE.memory=(STATE.memory?STATE.memory+'\n':'')+add;
      sSet(SK.memory,STATE.memory);
    }
  }
}

// ══════════════════════════════════════════
// MARKDOWN RENDERER
// ══════════════════════════════════════════
function mdToHtml(text){
  const lines=text.split('\n');
  let html='', inCode=false, codeLang='', codeLines=[];
  lines.forEach(line=>{
    if(line.startsWith('```')){
      if(!inCode){ inCode=true; codeLang=line.slice(3).trim(); codeLines=[]; }
      else {
        const escaped=codeLines.join('\n').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        html+=`<div class="cblk"><div class="cblk-hd"><span class="clang">${codeLang||'code'}</span><button class="ccopy" onclick="copyCode(this,'${encodeURIComponent(codeLines.join('\n'))}')">copy</button></div><pre class="cpre"><code>${escaped}</code></pre></div>`;
        inCode=false; codeLang=''; codeLines=[];
      }
      return;
    }
    if(inCode){ codeLines.push(line); return; }
    let l=line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    l=l.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
    l=l.replace(/\*(.*?)\*/g,'<em>$1</em>');
    l=l.replace(/`([^`]+)`/g,'<code class="ic">$1</code>');
    if(/^[-*•]\s/.test(line)) html+=`<div style="display:flex;gap:6px;margin-bottom:2px"><span style="color:var(--sub);flex-shrink:0">•</span><span>${l.replace(/^[-*•]\s/,'')}</span></div>`;
    else if(/^\d+\.\s/.test(line)) html+=`<div style="display:flex;gap:6px;margin-bottom:2px"><span style="color:var(--sub);flex-shrink:0">${line.match(/^\d+/)[0]}.</span><span>${l.replace(/^\d+\.\s/,'')}</span></div>`;
    else html+=`<span>${l}</span><br>`;
  });
  return html;
}

window.copyCode=function(btn,encoded){
  navigator.clipboard?.writeText(decodeURIComponent(encoded)).then(()=>{ btn.textContent='✓'; setTimeout(()=>btn.textContent='copy',1800); });
};
window.copyMsg=function(btn,encoded){
  navigator.clipboard?.writeText(decodeURIComponent(encoded)).then(()=>{
    const orig=btn.innerHTML; btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#22c55e" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>';
    setTimeout(()=>btn.innerHTML=orig,1800);
  });
};
window.regenMsg=function(){ regenerate(); };
window.scrollToBottom=function(){ scrollBottom(); };

let recognition=null;
function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert('Coba Chrome untuk voice input.'); return; }
  if(STATE.listening){ recognition?.stop(); STATE.listening=false; render(); return; }
  recognition=new SR(); recognition.lang='id-ID'; recognition.continuous=false; recognition.interimResults=false;
  recognition.onstart=()=>{ STATE.listening=true; render(); };
  recognition.onresult=e=>{ document.getElementById('ta-in').value=e.results[0][0].transcript; STATE.listening=false; render(); };
  recognition.onerror=()=>{ STATE.listening=false; render(); };
  recognition.onend=()=>{ STATE.listening=false; render(); };
  recognition.start();
}

// INIT
// ══════════════════════════════════════════
async function init(){
  // Load saved state
  const dk=sGet(SK.dark); if(dk!==null) STATE.isDark=dk;
  const p=sGet(SK.profile), st=sGet(SK.settings), m=sGet(SK.memory),
        ms=sGet(SK.messages), h=sGet(SK.history), sk=sGet(SK.streak);

  applyTheme();

  if(!p?.name){ STATE.phase='setup'; render(); return; }

  STATE.profile=p;
  if(st) STATE.cfg=st;
  if(m) STATE.memory=m;
  if(h) STATE.apiHistory=h;
  if(ms?.length) STATE.messages=ms;

  // Streak
  const today=new Date().toDateString();
  let ns={count:1,lastDate:today,totalDays:1};
  if(sk){
    const diff=Math.floor((new Date(today)-new Date(sk.lastDate))/864e5);
    if(diff===0) ns=sk;
    else if(diff===1) ns={count:sk.count+1,lastDate:today,totalDays:(sk.totalDays||0)+1};
    else ns={count:1,lastDate:today,totalDays:(sk.totalDays||0)+1};
  }
  STATE.streak=ns; sSet(SK.streak,ns);

  applyAccent();
  await loadModel();
}

init();
</script>
