<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#302b63"/>
<title>Liquid AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;}
body{background:#0f0c29;}

@keyframes lq-blink{0%,80%,100%{transform:scale(.8);opacity:.3;}40%{transform:scale(1.2);opacity:1;}}
@keyframes lq-cursor{0%,100%{opacity:1;}50%{opacity:0;}}
@keyframes lq-fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes lq-slideup{from{transform:translateY(60px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes lq-float1{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(30px,-20px) scale(1.05);}66%{transform:translate(-20px,10px) scale(.95);}}
@keyframes lq-float2{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(-25px,15px) scale(1.08);}66%{transform:translate(15px,-25px) scale(.92);}}
@keyframes lq-float3{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(20px,30px) scale(.95);}66%{transform:translate(-30px,-10px) scale(1.05);}}
@keyframes lq-pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
@keyframes lq-spin{to{transform:rotate(360deg);}}

/* BG */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);}
.blob{position:absolute;border-radius:50%;filter:blur(40px);}
.b1{width:500px;height:500px;top:-10%;left:-10%;background:radial-gradient(circle,rgba(120,80,255,.5),transparent 70%);animation:lq-float1 8s ease-in-out infinite;}
.b2{width:400px;height:400px;top:30%;right:-5%;background:radial-gradient(circle,rgba(0,200,255,.4),transparent 70%);animation:lq-float2 10s ease-in-out infinite;}
.b3{width:350px;height:350px;bottom:-5%;left:20%;background:radial-gradient(circle,rgba(255,100,180,.4),transparent 70%);animation:lq-float3 12s ease-in-out infinite;}
.b4{width:300px;height:300px;top:15%;left:40%;background:radial-gradient(circle,rgba(80,200,120,.3),transparent 70%);animation:lq-float1 9s ease-in-out infinite reverse;}

/* GLASS */
.glass{background:rgba(255,255,255,.12);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.25);box-shadow:0 8px 32px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.3);}
.glass-dark{background:rgba(0,0,0,.25);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 32px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08);}

/* LAYOUT */
#app{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.win{width:100%;max-width:480px;height:min(88vh,780px);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;position:relative;}

/* HEADER */
.hd{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:space-between;}
.hdav{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,rgba(120,80,255,.8),rgba(0,200,255,.8));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(120,80,255,.4);position:relative;flex-shrink:0;font-size:18px;}
.dot-on{position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid rgba(255,255,255,.3);}
.hd-name{font-weight:700;font-size:15px;color:#fff;letter-spacing:-.3px;display:flex;align-items:center;gap:6px;}
.hd-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:1px;}
.icon-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* MSGS */
.msgs{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px;}
.msgs::-webkit-scrollbar{width:4px;}
.msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:99px;}
.row-bot{display:flex;align-items:flex-start;gap:8px;animation:lq-fadein .2s ease;}
.row-usr{display:flex;justify-content:flex-end;animation:lq-fadein .2s ease;}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,rgba(120,80,255,.6),rgba(0,200,255,.6));display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
.bb{border-radius:4px 18px 18px 18px;padding:10px 14px 8px;max-width:290px;font-size:14px;line-height:1.65;color:rgba(255,255,255,.92);}
.bu{background:linear-gradient(135deg,rgba(120,80,255,.7),rgba(0,150,255,.7));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2);border-radius:18px 4px 18px 18px;padding:10px 14px;max-width:290px;font-size:14px;line-height:1.65;color:#fff;word-break:break-word;box-shadow:0 4px 16px rgba(120,80,255,.3);}
.ts{font-size:11px;color:rgba(255,255,255,.3);margin-top:4px;padding-left:4px;}
.ts-r{text-align:right;padding-left:0;padding-right:4px;}
.bb-actions{display:flex;align-items:center;gap:6px;margin-top:6px;}
.cp-btn,.regen-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:6px;cursor:pointer;padding:3px 8px;font-size:11px;color:rgba(255,255,255,.6);font-family:'DM Sans',sans-serif;transition:all .15s;}

/* TYPING */
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.7);animation:lq-blink 1.2s infinite ease-in-out;}
.cursor{display:inline-block;width:2px;height:14px;background:rgba(255,255,255,.8);border-radius:1px;margin-left:2px;vertical-align:middle;animation:lq-cursor .7s infinite;}

/* CODE */
.ic{background:rgba(255,255,255,.15);color:#e0d0ff;padding:1px 5px;border-radius:4px;font-size:12.5px;font-family:monospace;}
.cblk{background:rgba(0,0,0,.4);border-radius:12px;margin:8px 0;overflow:hidden;border:1px solid rgba(255,255,255,.1);}
.cblk-hd{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.08);}
.clang{color:rgba(255,255,255,.4);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-family:monospace;}
.ccopy{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.5);font-size:11px;font-family:'DM Sans',sans-serif;}
.cpre{padding:12px 14px;font-size:12px;font-family:monospace;overflow-x:auto;line-height:1.6;color:#e8e8e8;margin:0;}

/* QUICK */
.quick{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;border-top:1px solid rgba(255,255,255,.08);scrollbar-width:none;}
.quick::-webkit-scrollbar{display:none;}
.qchip{flex-shrink:0;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;backdrop-filter:blur(10px);}

/* INPUT */
.inrow{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:8px;align-items:flex-end;}
.ta-in{flex:1;resize:none;border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:10px 14px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;color:#fff;background:rgba(255,255,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);line-height:1.5;max-height:120px;overflow-y:auto;transition:border-color .2s;}
.ta-in:focus{border-color:rgba(120,80,255,.6)!important;background:rgba(255,255,255,.12)!important;}
.ta-in::placeholder{color:rgba(255,255,255,.3);}
.mic-btn{width:40px;height:40px;border-radius:13px;flex-shrink:0;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.6);transition:all .2s;}
.mic-btn.on{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.2);color:#ff6b6b;animation:lq-pulse 1s infinite;}
.send-btn{width:42px;height:42px;border-radius:13px;flex-shrink:0;background:linear-gradient(135deg,rgba(120,80,255,.8),rgba(0,150,255,.8));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;}
.send-btn:disabled{opacity:.3;cursor:default;box-shadow:none;}
.stop-btn{width:42px;height:42px;border-radius:13px;flex-shrink:0;background:rgba(239,68,68,.4);border:1px solid rgba(239,68,68,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.scroll-btn{position:absolute;bottom:130px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8);font-size:16px;z-index:10;animation:lq-fadein .2s ease;}

/* SETUP */
.setup-card{border-radius:28px;padding:48px 36px;width:100%;max-width:360px;text-align:center;animation:lq-fadein .5s ease;}
.glass-inp{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 14px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;color:#fff;transition:border-color .15s;}
.glass-inp:focus{border-color:rgba(120,80,255,.6)!important;background:rgba(255,255,255,.12)!important;}
.glass-inp::placeholder{color:rgba(255,255,255,.3);}
.primary-btn{background:linear-gradient(135deg,rgba(120,80,255,.9),rgba(0,150,255,.9));color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:13px 40px;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 4px 20px rgba(120,80,255,.4);transition:opacity .2s;width:100%;}

/* SETTINGS */
.overlay{position:fixed;inset:0;z-index:200;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;}
.sett-panel{width:100%;max-width:480px;border-radius:28px 28px 0 0;max-height:88vh;display:flex;flex-direction:column;animation:lq-slideup .3s cubic-bezier(.34,1.2,.64,1);}
.sett-hd{padding:20px 24px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;}
.sett-body{flex:1;overflow-y:auto;padding:20px 24px;}
.sett-body::-webkit-scrollbar{width:4px;}
.sett-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:99px;}
.sett-ft{padding:16px 24px;border-top:1px solid rgba(255,255,255,.1);}
.sec-lbl{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pcard{border-radius:14px;padding:12px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s;font-family:'DM Sans',sans-serif;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);}
.pcard.on{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.2);}
.lrow{display:flex;gap:8px;}
.lchip{flex:1;padding:9px;border-radius:12px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;transition:all .15s;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);}
.lchip.on{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.2);color:#fff;font-weight:600;}
.toggle{width:44px;height:24px;border-radius:99px;border:none;background:rgba(255,255,255,.15);cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.toggle.on{background:rgba(120,80,255,.8);}
.tknob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;display:block;}
.toggle.on .tknob{transform:translateX(20px);}
.streak-box{background:rgba(255,200,0,.1);border:1px solid rgba(255,200,0,.2);border-radius:14px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:rgba(255,255,255,.8);}
.btn-row{display:flex;gap:8px;}
.outline-btn{flex:1;padding:10px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.danger-btn{flex:1;padding:10px;border-radius:12px;background:rgba(255,60,60,.15);border:1px solid rgba(255,60,60,.3);color:#ff6b6b;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.sec{margin-bottom:22px;}

/* BANNERS */
.banner-incog{background:rgba(30,41,59,.6);color:#94a3b8;padding:8px 16px;font-size:12px;text-align:center;}
.banner-err{background:rgba(255,100,60,.15);color:#ffa07a;padding:9px 16px;font-size:13px;border-bottom:1px solid rgba(255,100,60,.2);}
.badge-incog{font-size:11px;background:rgba(148,163,184,.15);color:#94a3b8;padding:2px 7px;border-radius:99px;}
</style>
</head>
<body>
<div id="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
</div>
<div id="app"></div>

<script>
// ══ CONSTANTS ══════════════════════════════════════════
const APP = "Liquid AI";
const SK  = { profile:"lq:profile", settings:"lq:settings", messages:"lq:messages", history:"lq:history", memory:"lq:memory", streak:"lq:streak" };
const PERSONALITIES = {
  friendly:{ label:"Friendly", icon:"😊", desc:"Warm & supportif",     prompt:"Kamu ramah, hangat, dan supportif. Sesekali pakai emoji. Buat pengguna nyaman." },
  santai:  { label:"Santai",   icon:"😎", desc:"Gaul kayak temen",      prompt:"Kamu santai dan gaul. Pakai bahasa Indonesia sehari-hari, boleh slang." },
  pro:     { label:"Pro",      icon:"💼", desc:"Formal & terstruktur",   prompt:"Kamu profesional dan terstruktur. Bahasa Indonesia yang baik dan benar." },
  sassy:   { label:"Sassy",    icon:"😏", desc:"Witty & tajam",          prompt:"Kamu witty, cerdas, sedikit sarkastik tapi tetap helpful. Humor tajam." },
};
const LENGTHS = {
  short: { label:"Singkat ⚡", tokens:300,  extra:"Jawab SANGAT singkat, max 2-3 kalimat." },
  normal:{ label:"Normal 💬",  tokens:900,  extra:"" },
  detail:{ label:"Detail 📖", tokens:1600, extra:"Jawab lengkap dan detail dengan contoh." },
};
const QUICK_PROMPTS = [
  {icon:"💻",text:"Bantu aku coding:"},{icon:"🌐",text:"Translate ke Inggris:"},
  {icon:"📝",text:"Buatin ringkasan:"},{icon:"🎓",text:"Jelasin simpel:"},
  {icon:"💡",text:"Kasih ide tentang"},{icon:"🎲",text:"Fakta menarik tentang"},
  {icon:"📅",text:"Buatin jadwal untuk"},{icon:"🔍",text:"Bedain perbedaan antara"},
];

// ══ STORAGE ════════════════════════════════════════════
function sGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch{ return null; } }
function sSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }

// ══ STATE ══════════════════════════════════════════════
const S = {
  phase:"init",
  profile:{name:""},
  cfg:{personality:"friendly",length:"normal",incognito:false},
  memory:"",
  messages:[],
  apiHistory:[],
  generating:false,
  streamText:null,
  listening:false,
  error:"",
  showScroll:false,
  showSettings:false,
  streak:null,
  abortCtrl:null,
};
let recognition=null;

function now(){ return new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}); }

// ══ 🧠 OTAK — Claude API (swap untuk offline nanti) ════
async function* streamAI(history, system, tokens, signal){
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST", signal,
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:tokens, system, stream:true, messages:history.slice(-20) }),
  });
  if(!res.ok) throw new Error(`API ${res.status}`);
  const reader=res.body.getReader(), dec=new TextDecoder(); let buf="";
  while(true){
    const {done,value}=await reader.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split("\n"); buf=lines.pop();
    for(const ln of lines){
      if(!ln.startsWith("data: ")) continue;
      const d=ln.slice(6).trim(); if(d==="[DONE]") continue;
      try{ const p=JSON.parse(d); if(p.type==="content_block_delta"&&p.delta?.type==="text_delta") yield p.delta.text; }catch{}
    }
  }
}

function buildPrompt(){
  const p=PERSONALITIES[S.cfg.personality]||PERSONALITIES.friendly;
  const l=LENGTHS[S.cfg.length]||LENGTHS.normal;
  return `Kamu adalah ${APP}, asisten pribadi dari ${S.profile.name}.
KEPRIBADIAN: ${p.prompt}
${l.extra?`PANJANG: ${l.extra}`:""}
INFO TENTANG ${S.profile.name.toUpperCase()}: ${S.memory?.trim()||"Belum ada catatan."}
ATURAN: Panggil "${S.profile.name}" sesekali. Jawab Bahasa Indonesia kecuali diminta lain. Gunakan markdown jika membantu.`;
}

// ══ MARKDOWN ═══════════════════════════════════════════
function mdToHtml(text){
  const lines=text.split("\n"); let html="",inCode=false,codeLang="",codeLines=[];
  lines.forEach(line=>{
    if(line.startsWith("```")){
      if(!inCode){inCode=true;codeLang=line.slice(3).trim();codeLines=[];}
      else{
        const esc=codeLines.join("\n").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
        html+=`<div class="cblk"><div class="cblk-hd"><span class="clang">${codeLang||"code"}</span><button class="ccopy" onclick="cpCode(this,'${encodeURIComponent(codeLines.join('\n'))}')">copy</button></div><pre class="cpre"><code>${esc}</code></pre></div>`;
        inCode=false;codeLang="";codeLines=[];
      } return;
    }
    if(inCode){codeLines.push(line);return;}
    let l=line.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    l=l.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
    l=l.replace(/\*(.*?)\*/g,"<em>$1</em>");
    l=l.replace(/`([^`]+)`/g,'<code class="ic">$1</code>');
    if(/^[-*•]\s/.test(line)) html+=`<div style="display:flex;gap:6px;margin-bottom:3px"><span style="opacity:.5;flex-shrink:0">•</span><span>${l.replace(/^[-*•]\s/,"")}</span></div>`;
    else if(/^\d+\.\s/.test(line)) html+=`<div style="display:flex;gap:6px;margin-bottom:3px"><span style="opacity:.5;flex-shrink:0">${line.match(/^\d+/)[0]}.</span><span>${l.replace(/^\d+\.\s/,"")}</span></div>`;
    else html+=`<span>${l}</span><br>`;
  });
  return html;
}

window.cpCode=function(btn,enc){ navigator.clipboard?.writeText(decodeURIComponent(enc)).then(()=>{btn.textContent="✓";setTimeout(()=>btn.textContent="copy",1800);}); };
window.cpMsg=function(btn,enc){ navigator.clipboard?.writeText(decodeURIComponent(enc)).then(()=>{btn.textContent="✓";setTimeout(()=>btn.textContent="⌘ copy",1800);}); };
window.regenMsg=function(){ regenerate(); };
window.scrollBot=function(){ document.getElementById("msgs")?.scrollTo({top:99999,behavior:"smooth"}); };

// ══ ACTIONS ════════════════════════════════════════════
function addBotMsg(text){
  const m={id:Date.now(),from:"bot",text,time:now()};
  S.messages.push(m);
  if(!S.cfg.incognito) sSet(SK.messages,S.messages.slice(-100));
}

async function sendMessage(text){
  if(!text||S.generating) return;
  S.error=""; S.generating=true; S.streamText="";
  const userMsg={id:Date.now(),from:"user",text,time:now()};
  S.messages.push(userMsg);
  S.apiHistory.push({role:"user",content:text});
  render(); scrollBottom();

  const ctrl=new AbortController(); S.abortCtrl=ctrl;
  let full="";
  try{
    const gen=streamAI(S.apiHistory,buildPrompt(),LENGTHS[S.cfg.length]?.tokens||900,ctrl.signal);
    for await(const chunk of gen){ full+=chunk; S.streamText=full; renderStream(); }
  }catch(e){
    if(e.name!=="AbortError"){ S.error="Koneksi gagal. Coba lagi."; S.apiHistory.pop(); }
  }
  if(full){
    S.apiHistory.push({role:"assistant",content:full});
    addBotMsg(full);
    if(!S.cfg.incognito){ sSet(SK.messages,S.messages.slice(-100)); sSet(SK.history,S.apiHistory.slice(-40)); }
  }
  S.streamText=null; S.generating=false; S.abortCtrl=null;
  render(); scrollBottom(); document.getElementById("ta-in")?.focus();
}

function stopGen(){ S.abortCtrl?.abort(); }

async function regenerate(){
  if(S.generating||S.messages.length<2) return;
  const li=[...S.messages].map(m=>m.from).lastIndexOf("bot");
  if(li===-1) return;
  S.messages.splice(li,1);
  const hist=S.apiHistory; const lai=hist.map(m=>m.role).lastIndexOf("assistant");
  if(lai!==-1) hist.splice(lai,1);
  const lastU=hist[hist.length-1]; if(!lastU) return;
  hist.pop(); S.apiHistory=[...hist];
  S.generating=true; S.streamText=""; S.error="";
  render(); scrollBottom();
  const newHist=[...hist,{role:"user",content:lastU.content}]; S.apiHistory=newHist;
  const ctrl=new AbortController(); S.abortCtrl=ctrl;
  let full="";
  try{
    const gen=streamAI(newHist,buildPrompt(),LENGTHS[S.cfg.length]?.tokens||900,ctrl.signal);
    for await(const chunk of gen){ full+=chunk; S.streamText=full; renderStream(); }
  }catch(e){ if(e.name!=="AbortError"){ S.error="Gagal."; } }
  if(full){
    S.apiHistory=[...newHist,{role:"assistant",content:full}];
    addBotMsg(full);
    if(!S.cfg.incognito){ sSet(SK.messages,S.messages.slice(-100)); sSet(SK.history,S.apiHistory.slice(-40)); }
  }
  S.streamText=null; S.generating=false; S.abortCtrl=null;
  render(); scrollBottom(); document.getElementById("ta-in")?.focus();
}

function clearChat(){
  S.messages=[]; S.apiHistory=[];
  sSet(SK.messages,[]); sSet(SK.history,[]);
  addBotMsg(`Chat direset! Ada yang mau dibahas, **${S.profile.name}**? ✨`);
}

function exportChat(){
  const body=S.messages.map(m=>`**${m.from==="user"?S.profile.name:APP}** · ${m.time}\n\n${m.text}`).join("\n\n---\n\n");
  const blob=new Blob([`# Chat dengan ${APP}\n\n`+body],{type:"text/markdown"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=`liquid-ai-${new Date().toISOString().split("T")[0]}.md`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("Coba Chrome untuk voice input.");return;}
  if(S.listening){recognition?.stop();S.listening=false;render();return;}
  recognition=new SR(); recognition.lang="id-ID"; recognition.continuous=false; recognition.interimResults=false;
  recognition.onstart=()=>{S.listening=true;render();};
  recognition.onresult=e=>{document.getElementById("ta-in").value=e.results[0][0].transcript;S.listening=false;render();updateSendBtn();};
  recognition.onerror=()=>{S.listening=false;render();}; recognition.onend=()=>{S.listening=false;render();};
  recognition.start();
}

function scrollBottom(){ setTimeout(()=>{ const el=document.getElementById("msgs"); if(el) el.scrollTop=el.scrollHeight; },50); }

// ══ RENDER ═════════════════════════════════════════════
function render(){
  const app=document.getElementById("app");
  if(!app) return;
  if(S.phase==="setup"){ app.innerHTML=renderSetup(); bindSetup(); return; }
  app.innerHTML=renderChat();
  bindChat();
  if(S.showSettings){ document.body.insertAdjacentHTML("beforeend",renderSettings()); bindSettings(); }
}

function renderStream(){
  const sb=document.getElementById("stream-bubble");
  if(!sb) return;
  sb.innerHTML=S.streamText
    ?mdToHtml(S.streamText)+'<span class="cursor"></span>'
    :'<div style="display:flex;gap:5px;align-items:center;padding:4px 0"><span class="tdot" style="animation-delay:0ms"></span><span class="tdot" style="animation-delay:150ms"></span><span class="tdot" style="animation-delay:300ms"></span></div>';
  const msgs=document.getElementById("msgs"); if(msgs) msgs.scrollTop=msgs.scrollHeight;
}

function renderSetup(){
  return`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1">
    <div class="setup-card glass">
      <div style="font-size:56px;margin-bottom:16px;animation:lq-float2 3s ease-in-out infinite">💧</div>
      <div style="font-size:28px;font-weight:700;color:#fff;margin-bottom:8px;letter-spacing:-.5px">${APP}</div>
      <div style="font-size:14px;color:rgba(255,255,255,.6);margin-bottom:32px;line-height:1.6">Asisten AI pribadimu.<br>Siapa namamu?</div>
      <input id="setup-name" class="glass-inp" placeholder="Nama kamu..." style="text-align:center;margin-bottom:16px"/>
      <button id="setup-btn" class="primary-btn" style="opacity:.4">Mulai →</button>
    </div>
  </div>`;
}

function bindSetup(){
  const inp=document.getElementById("setup-name"), btn=document.getElementById("setup-btn");
  inp.addEventListener("input",()=>{ btn.style.opacity=inp.value.trim()?"1":".4"; });
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&inp.value.trim()) doSetup(inp.value.trim()); });
  btn.addEventListener("click",()=>{ if(inp.value.trim()) doSetup(inp.value.trim()); });
  inp.focus();
}

function doSetup(name){
  S.profile={name}; sSet(SK.profile,S.profile);
  const today=new Date().toDateString(); S.streak={count:1,lastDate:today,totalDays:1}; sSet(SK.streak,S.streak);
  S.messages=[]; addBotMsg(`Halo **${name}**! Senang ketemu kamu ✨ Aku **${APP}**, asisten pribadimu. Mau ngobrol soal apa?`);
  S.phase="chat"; render();
}

function renderChat(){
  const pers=PERSONALITIES[S.cfg.personality]||PERSONALITIES.friendly;
  const msgs=S.messages.map((msg,idx)=>{
    const isLast=idx===S.messages.length-1;
    if(msg.from==="bot") return`
      <div class="row-bot">
        <div class="av">💧</div>
        <div>
          <div class="bb glass">${mdToHtml(msg.text)}
            <div class="bb-actions">
              <button class="cp-btn" onclick="cpMsg(this,'${encodeURIComponent(msg.text)}')">⌘ copy</button>
              ${isLast&&!S.generating?'<button class="regen-btn" onclick="regenMsg()">↺ ulangi</button>':""}
            </div>
          </div>
          <div class="ts">${msg.time}</div>
        </div>
      </div>`;
    return`
      <div class="row-usr">
        <div>
          <div class="bu">${msg.text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div>
          <div class="ts ts-r">${msg.time}</div>
        </div>
      </div>`;
  }).join("");

  const streamBubble=S.generating?`
    <div class="row-bot">
      <div class="av">💧</div>
      <div class="bb glass" id="stream-bubble" style="max-width:290px">
        <div style="display:flex;gap:5px;align-items:center;padding:4px 0">
          <span class="tdot" style="animation-delay:0ms"></span>
          <span class="tdot" style="animation-delay:150ms"></span>
          <span class="tdot" style="animation-delay:300ms"></span>
        </div>
      </div>
    </div>`:"";

  return`
    <div class="win glass" style="position:relative;z-index:1">
      ${S.cfg.incognito?'<div class="banner-incog">🕵️ Mode Incognito — chat tidak tersimpan</div>':""}
      ${S.error?`<div class="banner-err">⚠️ ${S.error}</div>`:""}

      <div class="hd">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="hdav">💧<span class="dot-on"></span></div>
          <div>
            <div class="hd-name">${APP} <span>${pers.icon}</span>${S.cfg.incognito?'<span class="badge-incog">🕵️</span>':""}</div>
            <div class="hd-sub">${S.generating?"sedang mengetik...":pers.label+" · Claude API · Asisten "+S.profile.name}</div>
          </div>
        </div>
        <button class="icon-btn" id="btn-sett">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="rgba(255,255,255,.7)" stroke-width="1.8"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="rgba(255,255,255,.7)" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="msgs" id="msgs">${msgs}${streamBubble}</div>

      ${S.showScroll?'<button class="scroll-btn" onclick="scrollBot()">↓</button>':""}

      <div class="quick">${QUICK_PROMPTS.map(q=>`<button class="qchip" data-text="${q.text}">${q.icon} ${q.text}</button>`).join("")}</div>

      <div class="inrow">
        <button class="mic-btn${S.listening?" on":""}" id="btn-mic">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="9" y="2" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M5 10a7 7 0 0014 0M12 19v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <textarea id="ta-in" class="ta-in" rows="1"
          placeholder="${S.listening?"Liquid AI mendengarkan...":S.generating?"Liquid AI sedang mengetik...":"Ketik pesan..."}"
          ${S.generating?"disabled":""}
          style="opacity:${S.generating?.5:1}"></textarea>
        ${S.generating
          ?'<button class="stop-btn" id="btn-stop"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" fill="white"/></svg></button>'
          :'<button class="send-btn" id="btn-send" disabled><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'
        }
      </div>
    </div>`;
}

function bindChat(){
  document.getElementById("btn-sett")?.addEventListener("click",()=>{ S.showSettings=true; render(); });
  document.getElementById("btn-mic")?.addEventListener("click",toggleVoice);
  document.getElementById("btn-stop")?.addEventListener("click",stopGen);

  const ta=document.getElementById("ta-in"), sb=document.getElementById("btn-send");
  const msgs=document.getElementById("msgs");

  if(ta){
    ta.addEventListener("input",()=>{ if(sb) sb.disabled=!ta.value.trim(); ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,120)+"px"; });
    ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); doSend(ta); } });
  }
  if(sb) sb.addEventListener("click",()=>doSend(ta));

  document.querySelectorAll(".qchip").forEach(b=>{ b.addEventListener("click",()=>{ if(ta){ta.value=b.dataset.text+" ";ta.focus();if(sb)sb.disabled=false;} }); });

  if(msgs){
    msgs.scrollTop=msgs.scrollHeight;
    msgs.addEventListener("scroll",()=>{ S.showScroll=msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight>150; const sbtn=document.querySelector(".scroll-btn"); if(sbtn) sbtn.style.display=S.showScroll?"flex":"none"; });
  }
}

function doSend(ta){
  const text=ta?.value?.trim(); if(!text||S.generating) return;
  ta.value=""; ta.style.height="auto"; const sb=document.getElementById("btn-send"); if(sb) sb.disabled=true;
  sendMessage(text);
}

function updateSendBtn(){ const sb=document.getElementById("btn-send"),ta=document.getElementById("ta-in"); if(sb&&ta) sb.disabled=!ta.value.trim(); }

function renderSettings(){
  const cfg=S.cfg, sk=S.streak;
  return`<div class="overlay" id="sett-overlay">
    <div class="sett-panel glass-dark">
      <div class="sett-hd">
        <span style="font-weight:700;font-size:17px;color:#fff">Pengaturan</span>
        <button id="sett-close" style="background:rgba(255,255,255,.1);border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;color:rgba(255,255,255,.7);font-size:18px;display:flex;align-items:center;justify-content:center;">×</button>
      </div>
      <div class="sett-body">
        ${sk?`<div class="streak-box">🔥 Streak <strong style="color:#ffd60a">${sk.count} hari</strong> berturut-turut · ${sk.totalDays||1} hari total</div>`:""}
        <div class="sec"><div class="sec-lbl">Namamu</div>
          <input class="glass-inp" id="s-name" value="${S.profile.name}" placeholder="Nama kamu..."/>
        </div>
        <div class="sec"><div class="sec-lbl">Kepribadian</div>
          <div class="pgrid">${Object.entries(PERSONALITIES).map(([k,p])=>`
            <button class="pcard${cfg.personality===k?" on":""}" data-pers="${k}">
              <span style="font-size:20px">${p.icon}</span>
              <span style="font-weight:600;font-size:12px;color:#fff">${p.label}</span>
              <span style="font-size:11px;color:rgba(255,255,255,.5)">${p.desc}</span>
            </button>`).join("")}
          </div>
        </div>
        <div class="sec"><div class="sec-lbl">Panjang Jawaban</div>
          <div class="lrow">${Object.entries(LENGTHS).map(([k,l])=>`
            <button class="lchip${cfg.length===k?" on":""}" data-len="${k}">${l.label}</button>`).join("")}
          </div>
        </div>
        <div class="sec"><div class="sec-lbl">Mode Incognito</div>
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="font-size:13px;color:rgba(255,255,255,.6)">Chat tidak tersimpan</span>
            <button class="toggle${cfg.incognito?" on":""}" id="s-incog"><span class="tknob"></span></button>
          </div>
        </div>
        <div class="sec"><div class="sec-lbl">Memori</div>
          <p style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:8px;line-height:1.6">Liquid AI selalu ingat ini di setiap sesi.</p>
          <textarea class="glass-inp" id="s-mem" rows="4" style="resize:none;line-height:1.6" placeholder="Contoh: Kelas 9 SMP, suka coding & game...">${S.memory}</textarea>
        </div>
        <div class="sec"><div class="sec-lbl">Data</div>
          <div class="btn-row">
            <button class="outline-btn" id="s-export">📥 Export Chat</button>
            <button class="danger-btn" id="s-clear">🗑 Hapus Chat</button>
          </div>
        </div>
      </div>
      <div class="sett-ft"><button class="primary-btn" id="s-save">Simpan</button></div>
    </div>
  </div>`;
}

function bindSettings(){
  let selPers=S.cfg.personality, selLen=S.cfg.length, selIncog=S.cfg.incognito;

  document.getElementById("sett-close")?.addEventListener("click",closeSett);
  document.getElementById("sett-overlay")?.addEventListener("click",e=>{ if(e.target.id==="sett-overlay") closeSett(); });
  document.querySelectorAll(".pcard").forEach(b=>{ b.addEventListener("click",()=>{ selPers=b.dataset.pers; document.querySelectorAll(".pcard").forEach(x=>x.classList.toggle("on",x.dataset.pers===selPers)); }); });
  document.querySelectorAll(".lchip").forEach(b=>{ b.addEventListener("click",()=>{ selLen=b.dataset.len; document.querySelectorAll(".lchip").forEach(x=>x.classList.toggle("on",x.dataset.len===selLen)); }); });
  document.getElementById("s-incog")?.addEventListener("click",function(){ selIncog=!selIncog; this.classList.toggle("on",selIncog); });
  document.getElementById("s-export")?.addEventListener("click",exportChat);
  document.getElementById("s-clear")?.addEventListener("click",()=>{ clearChat(); closeSett(); });
  document.getElementById("s-save")?.addEventListener("click",()=>{
    const name=document.getElementById("s-name")?.value?.trim()||S.profile.name;
    const mem=document.getElementById("s-mem")?.value||"";
    S.profile={...S.profile,name}; S.cfg={...S.cfg,personality:selPers,length:selLen,incognito:selIncog}; S.memory=mem;
    sSet(SK.profile,S.profile); sSet(SK.settings,S.cfg); sSet(SK.memory,mem);
    closeSett();
  });
}

function closeSett(){ S.showSettings=false; document.getElementById("sett-overlay")?.remove(); render(); }

// ══ INIT ══════════════════════════════════════════════
function init(){
  const p=sGet(SK.profile), st=sGet(SK.settings), m=sGet(SK.memory),
        ms=sGet(SK.messages), h=sGet(SK.history), sk=sGet(SK.streak);

  if(!p?.name){ S.phase="setup"; render(); return; }

  S.profile=p; if(st) S.cfg={...S.cfg,...st}; if(m) S.memory=m;
  if(h) S.apiHistory=h;
  if(ms?.length) S.messages=ms;

  const today=new Date().toDateString(); let ns={count:1,lastDate:today,totalDays:1};
  if(sk){ const diff=Math.floor((new Date(today)-new Date(sk.lastDate))/864e5); if(diff===0) ns=sk; else if(diff===1) ns={count:sk.count+1,lastDate:today,totalDays:(sk.totalDays||0)+1}; else ns={count:1,lastDate:today,totalDays:(sk.totalDays||0)+1}; }
  S.streak=ns; sSet(SK.streak,ns);

  if(!S.messages.length) addBotMsg(`Halo **${p.name}**! Aku **${APP}**, asisten pribadimu ✨ Ada yang mau dibahas?`);

  S.phase="chat"; render();
  setTimeout(scrollBottom, 100);
}

init();
</script>
