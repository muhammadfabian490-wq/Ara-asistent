<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#0f0c29"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Liquid AI v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;}
body{background:#0a0812;-webkit-font-smoothing:antialiased;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes blink{0%,80%,100%{transform:scale(.7);opacity:.3}40%{transform:scale(1.15);opacity:1}}
@keyframes cursor-blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:1}100%{transform:scale(2.5);opacity:0}}
@keyframes notif-in{from{transform:translateX(-50%) translateY(-60px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
@keyframes notif-out{from{transform:translateX(-50%) translateY(0);opacity:1}to{transform:translateX(-50%) translateY(-60px);opacity:0}}
@keyframes ctx-in{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes react-pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
#bg-canvas{position:fixed;inset:0;z-index:0;width:100%;height:100%;}
#app{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,12px) 12px env(safe-area-inset-bottom,12px);}
.win{width:100%;max-width:480px;height:100%;max-height:800px;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;position:relative;contain:layout style;}
.theme-purple .win{background:rgba(12,9,35,.9);border:1px solid rgba(120,80,255,.2);box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(120,80,255,.15);}
.theme-ocean  .win{background:rgba(6,20,45,.9);border:1px solid rgba(0,150,255,.2);box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(0,150,255,.15);}
.theme-rose   .win{background:rgba(35,8,20,.9);border:1px solid rgba(255,80,120,.2);box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,80,120,.15);}
.theme-forest .win{background:rgba(6,25,16,.9);border:1px solid rgba(50,200,100,.2);box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(50,200,100,.15);}
.theme-gold   .win{background:rgba(25,16,4,.9);border:1px solid rgba(255,200,50,.2);box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,200,50,.15);}
.hd{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.hdav{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;font-size:16px;}
.theme-purple .hdav{background:linear-gradient(135deg,#7850ff,#00c8ff);box-shadow:0 4px 14px rgba(120,80,255,.4);}
.theme-ocean  .hdav{background:linear-gradient(135deg,#0060ff,#00d4ff);box-shadow:0 4px 14px rgba(0,150,255,.4);}
.theme-rose   .hdav{background:linear-gradient(135deg,#ff3080,#ff8c50);box-shadow:0 4px 14px rgba(255,80,120,.4);}
.theme-forest .hdav{background:linear-gradient(135deg,#00a855,#80ff50);box-shadow:0 4px 14px rgba(50,200,100,.4);}
.theme-gold   .hdav{background:linear-gradient(135deg,#f0a500,#ffde50);box-shadow:0 4px 14px rgba(255,200,50,.4);}
.dot-on{position:absolute;bottom:0px;right:0px;width:9px;height:9px;border-radius:50%;background:#22c55e;border:2px solid rgba(0,0,0,.5);}
.hd-name{font-weight:700;font-size:14px;color:#fff;display:flex;align-items:center;gap:5px;}
.hd-sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:1px;}
.icon-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:background .12s;}
.icon-btn:active{background:rgba(255,255,255,.15);}
.hd-right{display:flex;gap:5px;align-items:center;}
.status-pill{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04);}
.sdot{width:5px;height:5px;border-radius:50%;}
.online .sdot{background:#22c55e;}
.offline .sdot{background:#ef4444;}
.stxt{font-size:10px;color:rgba(255,255,255,.35);}
.offline .stxt{color:#ef4444;}
.search-bar{padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0;display:none;animation:fadeIn .15s ease;}
.search-bar.show{display:block;}
.search-inp{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:9px;padding:6px 11px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;color:#fff;}
.search-inp::placeholder{color:rgba(255,255,255,.2);}
.pinned-bar{padding:6px 12px;border-bottom:1px solid rgba(255,255,255,.05);display:none;align-items:center;gap:7px;flex-shrink:0;background:rgba(255,220,50,.04);}
.pinned-bar.show{display:flex;}
.pinned-text{font-size:11px;color:rgba(255,255,255,.5);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sessions-overlay{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.65);}
.sessions-panel{position:absolute;left:0;top:0;bottom:0;width:78%;max-width:260px;background:rgba(10,7,28,.97);border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;animation:slideUp .22s ease;}
.session-item{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;display:flex;align-items:center;gap:9px;-webkit-tap-highlight-color:transparent;}
.session-item.active{background:rgba(120,80,255,.12);border-right:2px solid rgba(120,80,255,.7);}
.session-av{width:30px;height:30px;border-radius:50%;background:rgba(120,80,255,.25);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.session-name{font-size:13px;font-weight:600;color:#fff;}
.session-prev{font-size:11px;color:rgba(255,255,255,.35);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.msgs::-webkit-scrollbar{width:3px;}
.msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:99px;}
.row-bot{display:flex;align-items:flex-start;gap:7px;animation:fadeIn .18s ease;contain:layout;}
.row-usr{display:flex;justify-content:flex-end;animation:fadeIn .18s ease;contain:layout;}
.av{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;}
.theme-purple .av{background:linear-gradient(135deg,rgba(120,80,255,.4),rgba(0,200,255,.4));}
.theme-ocean  .av{background:linear-gradient(135deg,rgba(0,100,255,.4),rgba(0,200,255,.4));}
.theme-rose   .av{background:linear-gradient(135deg,rgba(255,50,120,.4),rgba(255,150,50,.4));}
.theme-forest .av{background:linear-gradient(135deg,rgba(0,180,80,.4),rgba(100,255,50,.4));}
.theme-gold   .av{background:linear-gradient(135deg,rgba(240,165,0,.4),rgba(255,220,50,.4));}
.bb{border-radius:4px 16px 16px 16px;padding:9px 12px 6px;max-width:285px;font-size:13.5px;line-height:1.65;color:rgba(255,255,255,.88);background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);}
.bu{border-radius:16px 4px 16px 16px;padding:9px 12px;max-width:285px;font-size:13.5px;line-height:1.65;color:#fff;word-break:break-word;border:1px solid rgba(255,255,255,.12);}
.theme-purple .bu{background:linear-gradient(135deg,rgba(100,55,215,.82),rgba(0,110,215,.82));box-shadow:0 3px 12px rgba(100,60,220,.25);}
.theme-ocean  .bu{background:linear-gradient(135deg,rgba(0,75,195,.82),rgba(0,155,215,.82));box-shadow:0 3px 12px rgba(0,120,200,.25);}
.theme-rose   .bu{background:linear-gradient(135deg,rgba(195,35,95,.82),rgba(215,95,35,.82));box-shadow:0 3px 12px rgba(200,60,80,.25);}
.theme-forest .bu{background:linear-gradient(135deg,rgba(0,135,55,.82),rgba(55,195,25,.82));box-shadow:0 3px 12px rgba(0,155,55,.25);}
.theme-gold   .bu{background:linear-gradient(135deg,rgba(195,125,0,.82),rgba(215,175,0,.82));box-shadow:0 3px 12px rgba(200,155,0,.25);}
.ts{font-size:10px;color:rgba(255,255,255,.22);margin-top:3px;padding-left:3px;}
.ts-r{text-align:right;padding-left:0;padding-right:3px;}
.bb-actions{display:flex;align-items:center;gap:3px;margin-top:4px;flex-wrap:wrap;}
.act-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:6px;cursor:pointer;padding:2px 6px;font-size:11px;color:rgba(255,255,255,.5);font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;transition:background .12s;}
.act-btn:active{background:rgba(255,255,255,.16);}
.reactions{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap;}
.reaction-chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:2px 6px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:2px;animation:react-pop .25s ease;-webkit-tap-highlight-color:transparent;}
.cnt{font-size:10px;color:rgba(255,255,255,.6);}
.msg-collapsed{max-height:75px;overflow:hidden;position:relative;}
.msg-collapsed::after{content:"";position:absolute;bottom:0;left:0;right:0;height:28px;background:linear-gradient(transparent,rgba(255,255,255,.07));}
.expand-btn{font-size:11px;color:rgba(255,255,255,.35);cursor:pointer;margin-top:3px;display:inline-block;-webkit-tap-highlight-color:transparent;}
.tdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);animation:blink 1.2s infinite ease-in-out;}
.cursor-blink{display:inline-block;width:2px;height:13px;background:rgba(255,255,255,.75);border-radius:1px;margin-left:2px;vertical-align:middle;animation:cursor-blink .7s infinite;}
.ic{background:rgba(255,255,255,.11);color:#d0b0ff;padding:1px 4px;border-radius:4px;font-size:12px;font-family:monospace;}
.cblk{background:rgba(0,0,0,.45);border-radius:11px;margin:7px 0;overflow:hidden;border:1px solid rgba(255,255,255,.09);}
.cblk-hd{display:flex;justify-content:space-between;align-items:center;padding:6px 11px;border-bottom:1px solid rgba(255,255,255,.06);}
.clang{color:rgba(255,255,255,.3);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-family:monospace;}
.ccopy{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.4);font-size:11px;font-family:'DM Sans',sans-serif;}
.cpre{padding:9px 11px;font-size:11.5px;font-family:monospace;overflow-x:auto;line-height:1.6;color:#ddd;margin:0;}
.img-preview{max-width:200px;border-radius:10px;margin-bottom:5px;display:block;}
.img-thumb{width:55px;height:55px;object-fit:cover;border-radius:8px;border:1px solid rgba(255,255,255,.12);}
.scroll-btn{position:absolute;bottom:125px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(15,10,40,.92);border:1px solid rgba(255,255,255,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.65);font-size:13px;z-index:10;animation:fadeIn .2s ease;box-shadow:0 4px 12px rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent;}
.quick{display:flex;gap:6px;padding:6px 12px;overflow-x:auto;border-top:1px solid rgba(255,255,255,.05);flex-shrink:0;scrollbar-width:none;}
.quick::-webkit-scrollbar{display:none;}
.qchip{flex-shrink:0;background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.08);border-radius:99px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.qchip:active{background:rgba(255,255,255,.13);}
.inrow{padding:9px 12px;border-top:1px solid rgba(255,255,255,.06);display:flex;gap:6px;align-items:flex-end;flex-shrink:0;}
.ta-in{flex:1;resize:none;border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:8px 12px;font-size:13.5px;font-family:'DM Sans',sans-serif;outline:none;color:#fff;background:rgba(255,255,255,.07);line-height:1.5;max-height:105px;overflow-y:auto;transition:border-color .18s,background .18s;}
.ta-in:focus{border-color:rgba(120,80,255,.45);background:rgba(255,255,255,.1);}
.ta-in::placeholder{color:rgba(255,255,255,.22);}
.mic-btn{width:36px;height:36px;border-radius:11px;flex-shrink:0;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.5);-webkit-tap-highlight-color:transparent;transition:all .18s;}
.mic-btn.on{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.12);color:#ff6b6b;animation:pulse 1s infinite;}
.attach-btn{width:36px;height:36px;border-radius:11px;flex-shrink:0;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.5);-webkit-tap-highlight-color:transparent;}
.send-btn{width:36px;height:36px;border-radius:11px;flex-shrink:0;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .15s,transform .1s;}
.theme-purple .send-btn:not(:disabled){background:linear-gradient(135deg,#7850ff,#0096ff);box-shadow:0 4px 14px rgba(120,80,255,.35);}
.theme-ocean  .send-btn:not(:disabled){background:linear-gradient(135deg,#0060ff,#00c8ff);box-shadow:0 4px 14px rgba(0,150,255,.35);}
.theme-rose   .send-btn:not(:disabled){background:linear-gradient(135deg,#ff3080,#ff8c00);box-shadow:0 4px 14px rgba(255,60,120,.35);}
.theme-forest .send-btn:not(:disabled){background:linear-gradient(135deg,#00a855,#80ff30);box-shadow:0 4px 14px rgba(0,180,80,.35);}
.theme-gold   .send-btn:not(:disabled){background:linear-gradient(135deg,#d4a000,#ffdd00);box-shadow:0 4px 14px rgba(220,180,0,.35);}
.send-btn:disabled{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);cursor:default;opacity:.4;}
.send-btn:active:not(:disabled){transform:scale(.9);}
.stop-btn{width:36px;height:36px;border-radius:11px;flex-shrink:0;background:rgba(239,68,68,.25);border:1px solid rgba(239,68,68,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.attach-preview{position:relative;display:inline-block;margin:3px 0;}
.attach-remove{position:absolute;top:-5px;right:-5px;width:15px;height:15px;border-radius:50%;background:#ef4444;border:none;cursor:pointer;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;}
.ctx-menu{position:fixed;z-index:300;background:rgba(16,12,38,.98);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:5px;min-width:155px;animation:ctx-in .13s ease;box-shadow:0 8px 28px rgba(0,0,0,.5);}
.ctx-item{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:8px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.8);-webkit-tap-highlight-color:transparent;}
.ctx-item:active{background:rgba(255,255,255,.08);}
.ctx-item.danger{color:#ff6b6b;}
.ctx-sep{height:1px;background:rgba(255,255,255,.06);margin:3px 0;}
.react-picker{position:fixed;z-index:301;background:rgba(16,12,38,.98);border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:5px 8px;display:flex;gap:3px;box-shadow:0 8px 28px rgba(0,0,0,.5);animation:ctx-in .13s ease;}
.react-opt{font-size:19px;cursor:pointer;padding:3px;border-radius:50%;-webkit-tap-highlight-color:transparent;}
.react-opt:active{transform:scale(1.3);}
.notif{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:400;background:rgba(16,12,38,.97);border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:9px 14px;font-size:13px;color:#fff;display:flex;align-items:center;gap:7px;box-shadow:0 6px 20px rgba(0,0,0,.4);white-space:nowrap;animation:notif-in .25s ease;}
.notif.out{animation:notif-out .25s ease forwards;}
.banner-incog{background:rgba(25,35,50,.7);color:#94a3b8;padding:5px 14px;font-size:11px;text-align:center;flex-shrink:0;}
.banner-err{background:rgba(255,70,40,.1);color:#ffa07a;padding:7px 14px;font-size:12px;border-bottom:1px solid rgba(255,70,40,.12);flex-shrink:0;}
.badge-incog{font-size:10px;background:rgba(148,163,184,.1);color:#94a3b8;padding:1px 5px;border-radius:99px;}
.glass-inp{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:9px 13px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;color:#fff;transition:border-color .15s,background .18s;}
.glass-inp:focus{border-color:rgba(120,80,255,.5);background:rgba(255,255,255,.11);}
.glass-inp::placeholder{color:rgba(255,255,255,.22);}
.primary-btn{background:linear-gradient(135deg,rgba(120,80,255,.88),rgba(0,150,255,.88));color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:11px 28px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 4px 18px rgba(120,80,255,.25);transition:opacity .18s,transform .1s;width:100%;}
.primary-btn:active{transform:scale(.97);}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;}
.sett-panel{width:100%;max-width:480px;border-radius:22px 22px 0 0;max-height:90vh;display:flex;flex-direction:column;background:rgba(10,7,28,.98);border:1px solid rgba(255,255,255,.08);border-bottom:none;animation:slideUp .25s cubic-bezier(.34,1.1,.64,1);}
.sett-hd{padding:16px 20px 12px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.sett-body{flex:1;overflow-y:auto;padding:16px 20px;}
.sett-body::-webkit-scrollbar{width:3px;}
.sett-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:99px;}
.sett-ft{padding:12px 20px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.sec{margin-bottom:20px;}
.sec-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.pcard{border-radius:12px;padding:10px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'DM Sans',sans-serif;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);-webkit-tap-highlight-color:transparent;transition:all .13s;}
.pcard.on{border-color:rgba(120,80,255,.45);background:rgba(120,80,255,.1);}
.lrow{display:flex;gap:6px;}
.lchip{flex:1;padding:7px;border-radius:10px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);color:rgba(255,255,255,.4);-webkit-tap-highlight-color:transparent;transition:all .13s;}
.lchip.on{border-color:rgba(120,80,255,.45);background:rgba(120,80,255,.1);color:#fff;font-weight:600;}
.theme-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
.theme-dot{width:100%;aspect-ratio:1;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.toggle{width:42px;height:22px;border-radius:99px;border:none;background:rgba(255,255,255,.1);cursor:pointer;position:relative;transition:background .18s;flex-shrink:0;}
.toggle.on{background:rgba(120,80,255,.75);}
.tknob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .18s;display:block;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.toggle.on .tknob{transform:translateX(20px);}
.trow{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.streak-box{background:rgba(255,200,0,.07);border:1px solid rgba(255,200,0,.12);border-radius:11px;padding:10px 13px;margin-bottom:16px;font-size:13px;color:rgba(255,255,255,.7);}
.btn-row{display:flex;gap:6px;}

<canvas id="bg-canvas"></canvas>

<script>
// ══ CANVAS BG ══════════════════════════════════════════
(function(){
  const c=document.getElementById('bg-canvas'),ctx=c.getContext('2d');
  let W,H,t=0;
  const blobs=[
    {x:.15,y:.2,r:.38,h:260,s:.35},{x:.82,y:.5,r:.32,h:200,s:.28},
    {x:.4,y:.88,r:.3,h:320,s:.32},{x:.65,y:.15,r:.24,h:160,s:.42},
  ];
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight;}
  resize();window.addEventListener('resize',resize,{passive:true});
  function draw(){
    requestAnimationFrame(draw);t+=.0025;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#0a0812';ctx.fillRect(0,0,W,H);
    blobs.forEach((b,i)=>{
      const x=(b.x+Math.sin(t*b.s+i)*.11)*W;
      const y=(b.y+Math.cos(t*b.s*1.3+i)*.09)*H;
      const r=Math.min(W,H)*b.r;
      const g=ctx.createRadialGradient(x,y,0,x,y,r);
      const hue=b.h+Math.sin(t*.4+i)*12;
      g.addColorStop(0,`hsla(${hue},68%,54%,.16)`);
      g.addColorStop(.5,`hsla(${hue},58%,44%,.05)`);
      g.addColorStop(1,'transparent');
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();
    });
  }
  draw();
})();

// ══ CONSTANTS ══════════════════════════════════════════
const APP='Liquid AI',VER='v4';
const SK={profile:'lq4:profile',settings:'lq4:settings',sessions:'lq4:sessions',memory:'lq4:memory',streak:'lq4:streak'};
const PERSONALITIES={
  friendly:{label:'Friendly',icon:'😊',desc:'Warm & supportif',prompt:'Kamu ramah, hangat, supportif. Sesekali pakai emoji.'},
  santai:{label:'Santai',icon:'😎',desc:'Gaul kayak temen',prompt:'Kamu santai dan gaul. Pakai bahasa Indonesia sehari-hari, boleh slang.'},
  pro:{label:'Pro',icon:'💼',desc:'Formal & terstruktur',prompt:'Kamu profesional dan terstruktur. Bahasa Indonesia yang baik dan benar.'},
  sassy:{label:'Sassy',icon:'😏',desc:'Witty & tajam',prompt:'Kamu witty, cerdas, sedikit sarkastik tapi tetap helpful.'},
};
const LENGTHS={
  short:{label:'Singkat ⚡',tokens:300,extra:'Jawab SANGAT singkat, max 2-3 kalimat.'},
  normal:{label:'Normal 💬',tokens:900,extra:''},
  detail:{label:'Detail 📖',tokens:1600,extra:'Jawab lengkap dan detail dengan contoh.'},
};
const THEMES={purple:'linear-gradient(135deg,#7850ff,#00c8ff)',ocean:'linear-gradient(135deg,#0060ff,#00d4ff)',rose:'linear-gradient(135deg,#ff3080,#ff8c50)',forest:'linear-gradient(135deg,#00a855,#80ff50)',gold:'linear-gradient(135deg,#f0a500,#ffde50)'};
const QUICK=[
  {i:'💻',t:'Bantu aku coding:'},{i:'🌐',t:'Translate ke Inggris:'},{i:'📝',t:'Buatin ringkasan:'},
  {i:'🎓',t:'Jelasin simpel:'},{i:'💡',t:'Kasih ide tentang'},{i:'🎲',t:'Fakta menarik tentang'},
  {i:'📅',t:'Buatin jadwal untuk'},{i:'🔍',t:'Bedain perbedaan antara'},{i:'✍️',t:'Tulisin email tentang'},{i:'🧮',t:'Bantu hitung:'},
];
const EMOJIS=['👍','❤️','😂','😮','😢','🔥'];
const DEF_CFG={personality:'friendly',length:'normal',incognito:false,theme:'purple',notif:true,autoScroll:true,collapseMsg:true};

// ══ STORAGE ════════════════════════════════════════════
function sGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}
function sSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

// ══ STATE ══════════════════════════════════════════════
const S={
  phase:'init',profile:{name:''},cfg:{...DEF_CFG},memory:'',
  sessions:[],activeSession:0,generating:false,streamText:null,
  listening:false,error:'',showScroll:false,showSettings:false,
  showSessions:false,showSearch:false,searchQuery:'',
  online:navigator.onLine,streak:null,pendingImage:null,
  ctxMenu:null,reactPicker:null,abortCtrl:null,
};
let recognition=null,renderPending=false,scrollNext=false;

function getSession(){return S.sessions[S.activeSession]||{messages:[],apiHistory:[],pinned:null,name:'Chat'};}
function saveSessions(){if(!S.cfg.incognito)sSet(SK.sessions,S.sessions.map(s=>({...s,apiHistory:s.apiHistory.slice(-40)})));}
function addBotMsg(text){const s=getSession();s.messages.push({id:Date.now(),from:'bot',text,time:now(),reactions:{}});saveSessions();}
function now(){return new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ══ 🧠 OTAK ════════════════════════════════════════════
async function* streamAI(history,system,tokens,signal,img){
  const msgs=img
    ?[...history.slice(0,-1),{role:'user',content:[{type:'image',source:{type:'base64',media_type:img.mimeType,data:img.base64}},{type:'text',text:history[history.length-1].content||'Analisis gambar ini.'}]}]
    :history.slice(-20);
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',signal,headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:tokens,system,stream:true,messages:msgs.slice(-20)}),
  });
  if(!res.ok)throw new Error(`API ${res.status}`);
  const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
  while(true){
    const{done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const ln of lines){
      if(!ln.startsWith('data: '))continue;
      const d=ln.slice(6).trim();if(d==='[DONE]')continue;
      try{const p=JSON.parse(d);if(p.type==='content_block_delta'&&p.delta?.type==='text_delta')yield p.delta.text;}catch{}
    }
  }
}

function buildPrompt(){
  const p=PERSONALITIES[S.cfg.personality]||PERSONALITIES.friendly;
  const l=LENGTHS[S.cfg.length]||LENGTHS.normal;
  return`Kamu adalah ${APP} ${VER}, asisten pribadi dari ${S.profile.name}.\nKEPRIBADIAN: ${p.prompt}\n${l.extra?'PANJANG: '+l.extra:''}\nINFO: ${S.memory?.trim()||'Belum ada catatan.'}\nAturan: Panggil "${S.profile.name}" sesekali. Jawab Bahasa Indonesia kecuali diminta lain. Gunakan markdown jika membantu.`;
}

// ══ MARKDOWN ═══════════════════════════════════════════
function md(text){
  const lines=text.split('\n');let html='',inCode=false,lang='',cLines=[];
  lines.forEach(l=>{
    if(l.startsWith('```')){
      if(!inCode){inCode=true;lang=l.slice(3).trim();cLines=[];}
      else{const e=cLines.join('\n').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');html+=`<div class="cblk"><div class="cblk-hd"><span class="clang">${lang||'code'}</span><button class="ccopy" onclick="cpCode(this,'${encodeURIComponent(cLines.join('\n'))}')">copy</button></div><pre class="cpre"><code>${e}</code></pre></div>`;inCode=false;lang='';cLines=[];}return;
    }
    if(inCode){cLines.push(l);return;}
    if(l.startsWith('### '))return void(html+=`<div style="font-weight:700;font-size:13px;color:rgba(255,255,255,.88);margin:7px 0 3px">${esc(l.slice(4))}</div>`);
    if(l.startsWith('## '))return void(html+=`<div style="font-weight:700;font-size:14px;color:#fff;margin:9px 0 4px">${esc(l.slice(3))}</div>`);
    if(l.startsWith('---'))return void(html+=`<hr style="border:none;border-top:1px solid rgba(255,255,255,.09);margin:7px 0"/>`);
    let s=esc(l);
    s=s.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/\*(.*?)\*/g,'<em>$1</em>');
    s=s.replace(/`([^`]+)`/g,'<code class="ic">$1</code>');
    if(/^[-*•]\s/.test(l))html+=`<div style="display:flex;gap:5px;margin-bottom:2px"><span style="opacity:.4;flex-shrink:0">•</span><span>${s.replace(/^[-*•]\s/,'')}</span></div>`;
    else if(/^\d+\.\s/.test(l))html+=`<div style="display:flex;gap:5px;margin-bottom:2px"><span style="opacity:.4;flex-shrink:0">${l.match(/^\d+/)[0]}.</span><span>${s.replace(/^\d+\.\s/,'')}</span></div>`;
    else html+=`<span>${s}</span><br>`;
  });
  return html;
}

// ══ GLOBAL HANDLERS ════════════════════════════════════
window.cpCode=function(btn,enc){navigator.clipboard?.writeText(decodeURIComponent(enc)).then(()=>{btn.textContent='✓ copied';setTimeout(()=>btn.textContent='copy',1800);});};
window.cpMsg=function(id){const msg=getSession().messages.find(m=>m.id===id);if(msg)navigator.clipboard?.writeText(msg.text).then(()=>notif('💬 Disalin!'));};
window.pinMsg=function(id){const s=getSession();s.pinned=s.pinned===id?null:id;saveSessions();schedRender();};
window.regenMsg=function(){regen();};
window.scrollBot=function(){const el=document.getElementById('msgs');if(el)el.scrollTo({top:el.scrollHeight,behavior:'smooth'});};
window.expand=function(btn,id){const el=document.getElementById('mc-'+id);if(!el)return;el.classList.toggle('msg-collapsed');btn.textContent=el.classList.contains('msg-collapsed')?'Lihat selengkapnya...':'Tampilkan sedikit';};
window.openReact=function(id,el){const r=el.getBoundingClientRect();S.reactPicker={msgId:id,x:Math.min(r.left,innerWidth-190),y:r.top-55};schedRender();};
window.addReact=function(id,e){const s=getSession(),m=s.messages.find(x=>x.id===id);if(!m)return;if(!m.reactions)m.reactions={};m.reactions[e]=(m.reactions[e]||0)+1;saveSessions();S.reactPicker=null;schedRender();};
window.openCtx=function(id,ev){ev.preventDefault();S.ctxMenu={msgId:id,x:Math.min(ev.clientX,innerWidth-170),y:Math.min(ev.clientY,innerHeight-190)};schedRender();};
window.closeMenus=function(){S.ctxMenu=null;S.reactPicker=null;const el=document.querySelectorAll('.ctx-menu,.react-picker');el.forEach(e=>e.remove());};
window.delMsg=function(id){const s=getSession();s.messages=s.messages.filter(m=>m.id!==id);saveSessions();closeMenus();schedRender();};
window.switchSession=function(i){S.activeSession=i;S.showSessions=false;schedRender();schedScroll();};
window.newSession=function(){S.sessions.push({messages:[],apiHistory:[],pinned:null,name:'Chat '+(S.sessions.length+1)});S.activeSession=S.sessions.length-1;addBotMsg(`Sesi baru! Halo **${S.profile.name}** 👋`);saveSessions();S.showSessions=false;schedRender();schedScroll();};
window.S=S;window.getSession=getSession;window.saveSessions=saveSessions;window.schedRender=schedRender;

// ══ ACTIONS ════════════════════════════════════════════
async function sendMessage(text,img){
  if((!text&&!img)||S.generating)return;
  S.error='';S.generating=true;S.streamText='';
  const sess=getSession();
  sess.messages.push({id:Date.now(),from:'user',text:text||(img?'[Gambar]':''),time:now(),reactions:{},imgThumb:img?.thumb});
  sess.apiHistory.push({role:'user',content:text||'Tolong analisis gambar ini.'});
  S.pendingImage=null;schedRender();schedScroll();
  const ctrl=new AbortController();S.abortCtrl=ctrl;
  let full='';
  try{
    for await(const chunk of streamAI(sess.apiHistory,buildPrompt(),LENGTHS[S.cfg.length]?.tokens||900,ctrl.signal,img)){
      full+=chunk;S.streamText=full;streamUpdate();
    }
  }catch(e){if(e.name!=='AbortError'){S.error='Koneksi gagal. Coba lagi.';sess.apiHistory.pop();}}
  if(full){
    sess.apiHistory.push({role:'assistant',content:full});addBotMsg(full);
    if(S.cfg.notif&&document.hidden)notif('💧 Liquid AI membalas!');
  }
  S.streamText=null;S.generating=false;S.abortCtrl=null;
  schedRender();schedScroll();document.getElementById('ta-in')?.focus();
}

async function regen(){
  if(S.generating||getSession().messages.length<2)return;
  const sess=getSession();
  const li=[...sess.messages].map(m=>m.from).lastIndexOf('bot');if(li===-1)return;
  sess.messages.splice(li,1);
  const hist=sess.apiHistory,lai=hist.map(m=>m.role).lastIndexOf('assistant');
  if(lai!==-1)hist.splice(lai,1);
  const lastU=hist[hist.length-1];if(!lastU)return;
  hist.pop();sess.apiHistory=[...hist];
  S.generating=true;S.streamText='';S.error='';schedRender();schedScroll();
  const newH=[...hist,{role:'user',content:lastU.content}];sess.apiHistory=newH;
  const ctrl=new AbortController();S.abortCtrl=ctrl;
  let full='';
  try{for await(const chunk of streamAI(newH,buildPrompt(),LENGTHS[S.cfg.length]?.tokens||900,ctrl.signal)){full+=chunk;S.streamText=full;streamUpdate();}}
  catch(e){if(e.name!=='AbortError'){S.error='Gagal.';}}
  if(full){sess.apiHistory=[...newH,{role:'assistant',content:full}];addBotMsg(full);}
  S.streamText=null;S.generating=false;S.abortCtrl=null;schedRender();schedScroll();document.getElementById('ta-in')?.focus();
}

function streamUpdate(){
  const sb=document.getElementById('stream-bubble');
  if(!sb)return;
  sb.innerHTML=S.streamText
    ?md(S.streamText)+'<span class="cursor-blink"></span>'
    :'<div style="display:flex;gap:4px;align-items:center;padding:3px 0"><span class="tdot"></span><span class="tdot" style="animation-delay:150ms"></span><span class="tdot" style="animation-delay:300ms"></span></div>';
  if(S.cfg.autoScroll){const el=document.getElementById('msgs');if(el)el.scrollTop=el.scrollHeight;}
}

function clearChat(){const s=getSession();s.messages=[];s.apiHistory=[];s.pinned=null;saveSessions();addBotMsg(`Chat direset! Ada yang mau dibahas, **${S.profile.name}**? ✨`);schedRender();}

function exportChat(){
  const s=getSession();const body=s.messages.map(m=>`**${m.from==='user'?S.profile.name:APP}** · ${m.time}\n\n${m.text}`).join('\n\n---\n\n');
  const blob=new Blob([`# ${APP} ${VER} — ${new Date().toLocaleDateString('id-ID')}\n\n`+body],{type:'text/markdown'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`liquid-ai-${new Date().toISOString().split('T')[0]}.md`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);notif('📥 Chat diexport!');
}

function handleImg(file){
  if(!file||!file.type.startsWith('image/'))return;
  const r=new FileReader();
  r.onload=e=>{const b64=e.target.result.split(',')[1];S.pendingImage={base64:b64,mimeType:file.type,thumb:e.target.result};schedRender();};
  r.readAsDataURL(file);
}

function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){notif('⚠️ Coba Chrome untuk voice.');return;}
  if(S.listening){recognition?.stop();S.listening=false;schedRender();return;}
  recognition=new SR();recognition.lang='id-ID';recognition.continuous=false;recognition.interimResults=false;
  recognition.onstart=()=>{S.listening=true;schedRender();};
  recognition.onresult=e=>{const ta=document.getElementById('ta-in');if(ta){ta.value=e.results[0][0].transcript;updateSB();}S.listening=false;schedRender();};
  recognition.onerror=recognition.onend=()=>{S.listening=false;schedRender();};
  recognition.start();
}

function notif(text,dur=2400){
  const ex=document.querySelector('.notif');if(ex)ex.remove();
  const el=document.createElement('div');el.className='notif';el.textContent=text;
  document.body.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),280);},dur);
}

function updateSB(){const sb=document.getElementById('btn-send'),ta=document.getElementById('ta-in');if(sb&&ta)sb.disabled=!ta.value.trim()&&!S.pendingImage;}

// ══ RENDER ENGINE ══════════════════════════════════════
function schedRender(){if(renderPending)return;renderPending=true;requestAnimationFrame(()=>{renderPending=false;render();if(scrollNext){scrollNext=false;const el=document.getElementById('msgs');if(el&&S.cfg.autoScroll)el.scrollTo({top:el.scrollHeight,behavior:'smooth'});}});}
function schedScroll(){scrollNext=true;}

function render(){
  const app=document.getElementById('app');if(!app)return;
  document.body.className='theme-'+(S.cfg.theme||'purple');
  if(S.phase==='setup'){app.innerHTML=renderSetup();bindSetup();return;}
  app.innerHTML=renderChat();bindChat();
  if(S.showSettings){document.body.insertAdjacentHTML('beforeend',renderSettings());bindSettings();}
  if(S.ctxMenu)spawnCtx();
  if(S.reactPicker)spawnReact();
  if(S.showSessions){document.body.insertAdjacentHTML('beforeend',renderSessions());bindSessions();}
}

function renderSetup(){
  return`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:24px">
    <div style="width:100%;max-width:320px;text-align:center;animation:fadeIn .45s ease">
      <div style="font-size:52px;margin-bottom:14px">💧</div>
      <div style="font-size:24px;font-weight:700;color:#fff;margin-bottom:3px">${APP}</div>
      <div style="font-size:11px;color:rgba(255,255,255,.3);margin-bottom:6px;letter-spacing:.08em">${VER}</div>
      <div style="font-size:13px;color:rgba(255,255,255,.45);margin-bottom:26px;line-height:1.7">Asisten AI pribadimu.<br>Siapa namamu?</div>
      <input id="sn" class="glass-inp" placeholder="Nama kamu..." style="text-align:center;margin-bottom:11px"/>
      <button id="sb" class="primary-btn" style="opacity:.4">Mulai →</button>
    </div>
  </div>`;
}
function bindSetup(){
  const i=document.getElementById('sn'),b=document.getElementById('sb');
  i.addEventListener('input',()=>b.style.opacity=i.value.trim()?'1':'.4');
  i.addEventListener('keydown',e=>{if(e.key==='Enter'&&i.value.trim())doSetup(i.value.trim());});
  b.addEventListener('click',()=>{if(i.value.trim())doSetup(i.value.trim());});
  i.focus();
}
function doSetup(name){
  S.profile={name};sSet(SK.profile,S.profile);
  const today=new Date().toDateString();S.streak={count:1,lastDate:today,totalDays:1};sSet(SK.streak,S.streak);
  S.sessions=[{messages:[],apiHistory:[],pinned:null,name:'Chat 1'}];S.activeSession=0;
  addBotMsg(`Halo **${name}**! Aku **${APP} ${VER}** — asisten pribadimu ✨\nKirim pesan atau foto, aku siap bantu!`);
  S.phase='chat';schedRender();schedScroll();
}

function renderChat(){
  const sess=getSession(),pers=PERSONALITIES[S.cfg.personality]||PERSONALITIES.friendly;
  const filtered=S.searchQuery?sess.messages.filter(m=>m.text.toLowerCase().includes(S.searchQuery.toLowerCase())):sess.messages;
  const pinnedMsg=sess.pinned?sess.messages.find(m=>m.id===sess.pinned):null;

  const msgsHtml=filtered.map((msg,idx)=>{
    const isLast=idx===filtered.length-1,isPinned=sess.pinned===msg.id;
    const reacts=msg.reactions&&Object.keys(msg.reactions).length?`<div class="reactions">${Object.entries(msg.reactions).map(([e,c])=>`<div class="reaction-chip">${e}<span class="cnt">${c}</span></div>`).join('')}</div>`:'';
    if(msg.from==='bot'){
      const long=msg.text.length>550&&S.cfg.collapseMsg;
      return`<div class="row-bot" oncontextmenu="openCtx(${msg.id},event)">
        <div class="av">💧</div>
        <div>
          <div class="bb">
            ${msg.imgThumb?`<img src="${msg.imgThumb}" class="img-preview" style="max-width:180px"/>`:''}
            <div id="mc-${msg.id}" class="${long?'msg-collapsed':''}">${md(msg.text)}</div>
            ${long?`<span class="expand-btn" onclick="expand(this,${msg.id})">Lihat selengkapnya...</span>`:''}
            ${isPinned?'<div style="font-size:10px;color:rgba(255,220,50,.6);margin-top:3px">📌 Disematkan</div>':''}
            <div class="bb-actions">
              <button class="act-btn" onclick="cpMsg(${msg.id})">⌘ copy</button>
              <button class="act-btn" onclick="openReact(${msg.id},this)">😊</button>
              <button class="act-btn" onclick="pinMsg(${msg.id})">${isPinned?'unpin':'📌'}</button>
              ${isLast&&!S.generating?'<button class="act-btn" onclick="regenMsg()">↺</button>':''}
            </div>
            ${reacts}
          </div>
          <div class="ts">${msg.time}</div>
        </div>
      </div>`;
    }
    return`<div class="row-usr" oncontextmenu="openCtx(${msg.id},event)">
      <div>
        ${msg.imgThumb?`<div style="text-align:right;margin-bottom:4px"><img src="${msg.imgThumb}" class="img-thumb"/></div>`:''}
        <div class="bu">${esc(msg.text)}</div>
        <div class="bb-actions" style="justify-content:flex-end;margin-top:3px"><button class="act-btn" onclick="openReact(${msg.id},this)">😊</button></div>
        ${reacts}
        <div class="ts ts-r">${msg.time}</div>
      </div>
    </div>`;
  }).join('');

  const streamBubble=S.generating?`<div class="row-bot"><div class="av">💧</div>
    <div class="bb" id="stream-bubble" style="max-width:285px">
      <div style="display:flex;gap:4px;align-items:center;padding:3px 0">
        <span class="tdot"></span><span class="tdot" style="animation-delay:150ms"></span><span class="tdot" style="animation-delay:300ms"></span>
      </div>
    </div></div>`:'';

  return`<div class="win">
    ${S.cfg.incognito?'<div class="banner-incog">🕵️ Incognito aktif</div>':''}
    ${S.error?`<div class="banner-err">⚠️ ${S.error}</div>`:''}
    <div class="hd">
      <div style="display:flex;align-items:center;gap:9px">
        <button class="icon-btn" id="btn-sess" style="width:32px;height:32px;border-radius:9px;font-size:13px">☰</button>
        <div class="hdav">💧<span class="dot-on"></span></div>
        <div>
          <div class="hd-name">${APP} <span>${pers.icon}</span>${S.cfg.incognito?'<span class="badge-incog">🕵️</span>':''}</div>
          <div class="hd-sub">${S.generating?'mengetik...':pers.label+' · '+VER}</div>
        </div>
      </div>
      <div class="hd-right">
        <div class="status-pill ${S.online?'online':'offline'}"><div class="sdot"></div><span class="stxt">${S.online?'Online':'Offline'}</span></div>
        <button class="icon-btn" id="btn-srch"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="rgba(255,255,255,.55)" stroke-width="1.8"/><path d="M21 21l-4.35-4.35" stroke="rgba(255,255,255,.55)" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button class="icon-btn" id="btn-sett"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="rgba(255,255,255,.55)" stroke-width="1.8"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="rgba(255,255,255,.55)" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div class="search-bar ${S.showSearch?'show':''}"><input class="search-inp" id="sinp" placeholder="Cari pesan..." value="${S.searchQuery}"/></div>
    ${pinnedMsg?`<div class="pinned-bar show"><span>📌</span><span class="pinned-text">${esc(pinnedMsg.text.slice(0,55))}...</span><button class="act-btn" onclick="pinMsg(${pinnedMsg.id})" style="flex-shrink:0">×</button></div>`:''}
    <div class="msgs" id="msgs">${msgsHtml}${streamBubble}</div>
    ${S.showScroll?'<button class="scroll-btn" onclick="scrollBot()">↓</button>':''}
    ${S.pendingImage?`<div style="padding:5px 12px;border-top:1px solid rgba(255,255,255,.05);flex-shrink:0"><div class="attach-preview"><img src="${S.pendingImage.thumb}" class="img-thumb"/><button class="attach-remove" onclick="S.pendingImage=null;schedRender()">×</button></div></div>`:''}
    <div class="quick">${QUICK.map(q=>`<button class="qchip" data-t="${q.t}">${q.i} ${q.t}</button>`).join('')}</div>
    <div class="inrow">
      <button class="attach-btn" id="btn-att"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="rgba(255,255,255,.5)" stroke-width="1.8"/><circle cx="8.5" cy="8.5" r="1.5" fill="rgba(255,255,255,.5)"/><path d="M21 15l-5-5L5 21" stroke="rgba(255,255,255,.5)" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="mic-btn ${S.listening?'on':''}" id="btn-mic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="9" y="2" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M5 10a7 7 0 0014 0M12 19v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <textarea id="ta-in" class="ta-in" rows="1" placeholder="${S.listening?'Mendengarkan...':S.generating?'Mengetik...':'Pesan ke Liquid AI...'}" ${S.generating?'disabled':''} style="opacity:${S.generating?.55:1}"></textarea>
      ${S.generating
        ?'<button class="stop-btn" id="btn-stop"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" fill="white"/></svg></button>'
        :`<button class="send-btn" id="btn-send" ${!S.pendingImage?'disabled':''}><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`
      }
    </div>
    <input type="file" id="finp" accept="image/*" style="display:none"/>
  </div>`;
}

function bindChat(){
  document.getElementById('btn-sett')?.addEventListener('click',()=>{S.showSettings=true;schedRender();});
  document.getElementById('btn-sess')?.addEventListener('click',()=>{S.showSessions=true;schedRender();});
  document.getElementById('btn-mic')?.addEventListener('click',toggleVoice);
  document.getElementById('btn-stop')?.addEventListener('click',()=>S.abortCtrl?.abort());
  document.getElementById('btn-att')?.addEventListener('click',()=>document.getElementById('finp')?.click());
  document.getElementById('finp')?.addEventListener('change',e=>handleImg(e.target.files[0]));
  document.getElementById('btn-srch')?.addEventListener('click',()=>{S.showSearch=!S.showSearch;if(!S.showSearch)S.searchQuery='';schedRender();if(S.showSearch)setTimeout(()=>document.getElementById('sinp')?.focus(),60);});
  document.getElementById('sinp')?.addEventListener('input',e=>{S.searchQuery=e.target.value;schedRender();});
  const ta=document.getElementById('ta-in'),sb=document.getElementById('btn-send');
  if(ta){
    ta.addEventListener('input',()=>{if(sb)sb.disabled=!ta.value.trim()&&!S.pendingImage;ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,105)+'px';});
    ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend(ta);}});
    ta.addEventListener('paste',e=>{const it=[...e.clipboardData.items].find(i=>i.type.startsWith('image/'));if(it)handleImg(it.getAsFile());});
  }
  if(sb)sb.addEventListener('click',()=>doSend(ta));
  document.querySelectorAll('.qchip').forEach(b=>{b.addEventListener('click',()=>{if(ta){ta.value=b.dataset.t+' ';ta.focus();if(sb)sb.disabled=false;}});});
  const msgs=document.getElementById('msgs');
  if(msgs){
    msgs.scrollTop=msgs.scrollHeight;
    msgs.addEventListener('scroll',()=>{S.showScroll=msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight>180;const s=document.querySelector('.scroll-btn');if(s)s.style.display=S.showScroll?'flex':'none';},{passive:true});
  }
  document.addEventListener('click',()=>{if(S.ctxMenu||S.reactPicker){closeMenus();S.ctxMenu=null;S.reactPicker=null;}},{once:true});
}

function doSend(ta){
  const text=ta?.value?.trim();if((!text&&!S.pendingImage)||S.generating)return;
  const img=S.pendingImage;ta.value='';ta.style.height='auto';
  const sb=document.getElementById('btn-send');if(sb)sb.disabled=true;
  sendMessage(text,img);
}

function spawnCtx(){
  const{msgId,x,y}=S.ctxMenu;
  const el=document.createElement('div');el.className='ctx-menu';
  el.style.cssText=`left:${x}px;top:${y}px;position:fixed;z-index:300`;
  el.innerHTML=`<div class="ctx-item" onclick="cpMsg(${msgId});closeMenus()">📋 Salin</div>
    <div class="ctx-item" onclick="pinMsg(${msgId});closeMenus()">📌 Pin</div>
    <div class="ctx-item" onclick="openReact(${msgId},this);closeMenus()">😊 Reaksi</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item danger" onclick="delMsg(${msgId})">🗑 Hapus</div>`;
  document.body.appendChild(el);el.addEventListener('click',e=>e.stopPropagation());
}

function spawnReact(){
  const{msgId,x,y}=S.reactPicker;
  const el=document.createElement('div');el.className='react-picker';
  el.style.cssText=`left:${x}px;top:${y}px;position:fixed;z-index:301`;
  el.innerHTML=EMOJIS.map(e=>`<span class="react-opt" onclick="addReact(${msgId},'${e}')">${e}</span>`).join('');
  document.body.appendChild(el);el.addEventListener('click',ev=>ev.stopPropagation());
}

function renderSessions(){
  return`<div class="sessions-overlay" id="sov" onclick="if(event.target===this){S.showSessions=false;schedRender();}">
    <div class="sessions-panel">
      <div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between">
        <span style="font-weight:700;color:#fff;font-size:14px">💧 ${APP}</span>
        <button onclick="S.showSessions=false;schedRender()" style="background:none;border:none;color:rgba(255,255,255,.4);font-size:18px;cursor:pointer">×</button>
      </div>
      <div style="flex:1;overflow-y:auto">
        ${S.sessions.map((s,i)=>`<div class="session-item ${i===S.activeSession?'active':''}" onclick="switchSession(${i})">
          <div class="session-av">💬</div>
          <div><div class="session-name">${s.name}</div>
          <div class="session-prev">${s.messages[s.messages.length-1]?.text.slice(0,38)||'Kosong'}...</div></div>
        </div>`).join('')}
      </div>
      <div style="padding:10px 14px"><button class="primary-btn" onclick="newSession()" style="padding:10px;font-size:13px">+ Sesi Baru</button></div>
    </div>
  </div>`;
}
function bindSessions(){}

function renderSettings(){
  const c=S.cfg,sk=S.streak;
  return`<div class="overlay" id="sov2" onclick="if(event.target===this)closeSett()">
    <div class="sett-panel">
      <div class="sett-hd">
        <span style="font-weight:700;font-size:15px;color:#fff">Pengaturan ${VER}</span>
        <button onclick="closeSett()" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:50%;width:27px;height:27px;cursor:pointer;color:rgba(255,255,255,.55);font-size:15px;display:flex;align-items:center;justify-content:center">×</button>
      </div>
      <div class="sett-body">
        ${sk?`<div class="streak-box">🔥 Streak <strong style="color:#ffd60a">${sk.count} hari</strong> · ${sk.totalDays||1} hari total</div>`:''}
        <div class="sec"><div class="sec-lbl">Namamu</div><input class="glass-inp" id="sn2" value="${S.profile.name}" placeholder="Nama..."/></div>
        <div class="sec"><div class="sec-lbl">Kepribadian</div>
          <div class="pgrid">${Object.entries(PERSONALITIES).map(([k,p])=>`<button class="pcard ${c.personality===k?'on':''}" data-p="${k}"><span style="font-size:17px">${p.icon}</span><span style="font-weight:600;font-size:12px;color:#fff">${p.label}</span><span style="font-size:10px;color:rgba(255,255,255,.38)">${p.desc}</span></button>`).join('')}</div>
        </div>
        <div class="sec"><div class="sec-lbl">Panjang Jawaban</div>
          <div class="lrow">${Object.entries(LENGTHS).map(([k,l])=>`<button class="lchip ${c.length===k?'on':''}" data-l="${k}">${l.label}</button>`).join('')}</div>
        </div>
        <div class="sec"><div class="sec-lbl">Tema</div>
          <div class="theme-grid">${Object.entries(THEMES).map(([k,v])=>`<div class="theme-dot ${c.theme===k?'on':''}" data-th="${k}" style="background:${v};outline:${k===c.theme?'2px solid #fff':'2px solid transparent'};outline-offset:2px;cursor:pointer"></div>`).join('')}</div>
        </div>
        <div class="sec"><div class="sec-lbl">Fitur</div>
          ${[['tog-i','🕵️ Incognito',c.incognito],['tog-n','🔔 Notifikasi',c.notif],['tog-a','⬇️ Auto-scroll',c.autoScroll],['tog-c','📏 Collapse pesan panjang',c.collapseMsg]].map(([id,lbl,v])=>`
          <div class="trow"><span style="font-size:13px;color:rgba(255,255,255,.55)">${lbl}</span>
            <button class="toggle ${v?'on':''}" id="${id}"><span class="tknob"></span></button>
          </div>`).join('')}
        </div>
        <div class="sec"><div class="sec-lbl">Memori</div>
          <p style="font-size:11px;color:rgba(255,255,255,.3);margin-bottom:7px;line-height:1.6">Liquid AI selalu ingat ini di setiap sesi.</p>
          <textarea class="glass-inp" id="smem" rows="3" style="resize:none;line-height:1.6" placeholder="Kelas 9 SMP, suka coding & game...">${S.memory}</textarea>
        </div>
        <div class="sec"><div class="sec-lbl">Data</div>
          <div class="btn-row"><button class="outline-btn" id="sexp">📥 Export</button><button class="danger-btn" id="sclr">🗑 Reset Chat</button></div>
        </div>
      </div>
      <div class="sett-ft"><button class="primary-btn" id="ssave">Simpan Perubahan</button></div>
    </div>
  </div>`;
}

function bindSettings(){
  let p=S.cfg.personality,l=S.cfg.length,th=S.cfg.theme;
  let inc=S.cfg.incognito,not=S.cfg.notif,asc=S.cfg.autoScroll,col=S.cfg.collapseMsg;
  function tog(id,get,set){document.getElementById(id)?.addEventListener('click',function(){const v=!get();set(v);this.classList.toggle('on',v);});}
  tog('tog-i',()=>inc,v=>inc=v);tog('tog-n',()=>not,v=>not=v);tog('tog-a',()=>asc,v=>asc=v);tog('tog-c',()=>col,v=>col=v);
  document.querySelectorAll('.pcard').forEach(b=>{b.addEventListener('click',()=>{p=b.dataset.p;document.querySelectorAll('.pcard').forEach(x=>x.classList.toggle('on',x.dataset.p===p));});});
  document.querySelectorAll('.lchip').forEach(b=>{b.addEventListener('click',()=>{l=b.dataset.l;document.querySelectorAll('.lchip').forEach(x=>x.classList.toggle('on',x.dataset.l===l));});});
  document.querySelectorAll('.theme-dot').forEach(b=>{b.addEventListener('click',()=>{th=b.dataset.th;document.querySelectorAll('.theme-dot').forEach(x=>{x.classList.toggle('on',x.dataset.th===th);x.style.outlineColor=x.dataset.th===th?'#fff':'transparent';});document.body.className='theme-'+th;});});
  document.getElementById('sexp')?.addEventListener('click',exportChat);
  document.getElementById('sclr')?.addEventListener('click',()=>{clearChat();closeSett();});
  document.getElementById('ssave')?.addEventListener('click',()=>{
    const name=document.getElementById('sn2')?.value?.trim()||S.profile.name;
    const mem=document.getElementById('smem')?.value||'';
    S.profile={...S.profile,name};S.cfg={personality:p,length:l,theme:th,incognito:inc,notif:not,autoScroll:asc,collapseMsg:col};S.memory=mem;
    sSet(SK.profile,S.profile);sSet(SK.settings,S.cfg);sSet(SK.memory,mem);closeSett();notif('✅ Tersimpan!');
  });
}
function closeSett(){S.showSettings=false;document.getElementById('sov2')?.remove();schedRender();}

// ══ ONLINE/OFFLINE ═════════════════════════════════════
window.addEventListener('online',()=>{S.online=true;schedRender();notif('✅ Online!');},{passive:true});
window.addEventListener('offline',()=>{S.online=false;schedRender();notif('⚠️ Offline!');},{passive:true});

// ══ INIT ══════════════════════════════════════════════
function init(){
  const p=sGet(SK.profile),st=sGet(SK.settings),m=sGet(SK.memory),
        sess=sGet(SK.sessions),sk=sGet(SK.streak);
  if(st)S.cfg={...DEF_CFG,...st};
  document.body.className='theme-'+(S.cfg.theme||'purple');
  if(!p?.name){S.phase='setup';render();return;}
  S.profile=p;if(m)S.memory=m;
  S.sessions=sess?.length?sess:[{messages:[],apiHistory:[],pinned:null,name:'Chat 1'}];
  if(!S.sessions[0].messages.length)addBotMsg(`Halo **${p.name}**! Aku **${APP} ${VER}** ✨ Ada yang mau dibahas?`);
  const today=new Date().toDateString();let ns={count:1,lastDate:today,totalDays:1};
  if(sk){const d=Math.floor((new Date(today)-new Date(sk.lastDate))/864e5);if(d===0)ns=sk;else if(d===1)ns={count:sk.count+1,lastDate:today,totalDays:(sk.totalDays||0)+1};else ns={count:1,lastDate:today,totalDays:(sk.totalDays||0)+1};}
  S.streak=ns;sSet(SK.streak,ns);
  S.phase='chat';render();schedScroll();
}
init();
</script>
